</head>

<body>

<nav>

<div class="manage-container">

<h1>

About Infinite X

</h1>

<div id="aboutTeam">

</div>

</div>

<script>

// =====================
// DEV BUTTON
// =====================

if(

localStorage.getItem(
"developerLogged"
) === "true"

){

document.getElementById(
"devButton"
).style.display = "block";

}

// =====================
// TEAM DATA
// =====================

let team = [

{

title:

"🖼 Comic Builder",

name:

"",

image:

"comic-builder.jpg",

born:

"2026",

country:

"Indonesia",

joined:

"2026",

distribution:

"Story Creation"

},

{

title:

"👨 Build Web",

name:

"Evan",

image:

"builder.jpg",

born:

"2009",

country:

"Indonesia",

joined:

"2026",

distribution:

"Global"

},

{

title:

"🔒 Security Builder",

name:

"",

image:

"security-builder.jpg",

born:

"2026",

country:

"Indonesia",

joined:

"2026",

distribution:

"Protection"

}

];

// =====================
// RENDER TEAM
// =====================

let container =

document.getElementById(
"aboutTeam"
);

team.forEach(member=>{

container.innerHTML +=

`

<div class="about-card">

<div class="about-card-inner">

<div class="about-front">

<img

src="${member.image}"

class="about-image"

>

<h2>

${member.title}

</h2>

<h3>

${member.name}

</h3>

</div>

<div class="about-back">

<h2>

${member.title}

</h2>

<br>

<p>

🎂 Born

<br>

${member.born}

<br><br>

🌎 Country

<br>

${member.country}

<br><br>

📅 Joined

<br>

${member.joined}

<br><br>

📡 Distribution

<br>

${member.distribution}

</p>

</div>

</div>

</div>

`;

});

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
