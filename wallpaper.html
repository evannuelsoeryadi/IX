<!DOCTYPE html>
<html>

<head>

    <title>Wallpaper - Infinite X</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="manage.css">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="wallpaper.css">

</head>

<body>

<!-- NAVIGATION -->

<nav>

    <a href="home.html">Home</a>

    <a href="comic.html">Comic</a>

    <a href="character.html">Character</a>

    <a href="about.html">About Us</a>

    <a href="profile.html">Profile</a>

    <a href="developer.html"
       id="devButton"
       style="display:none;">
        ⚙️ Dev Panel
    </a>

</nav>


<!-- WALLPAPER PAGE -->

<div class="wallpaper-container">

    <h1>Wallpaper</h1>

    <p class="wallpaper-subtitle">
        Choose your preferred wallpaper
    </p>


    <div class="wallpaper-options">


        <!-- LIGHT -->

        <div class="wallpaper-card">

            <div class="wallpaper-preview light-preview">

                <div class="preview-content">

                    <div>🌞</div>

                    <span>
                        Light
                    </span>

                </div>

            </div>


            <div class="wallpaper-info">

                <h2>Light</h2>

                <p>
                    Bright and clean wallpaper
                </p>

                <a
                    href="light-wallpaper.html"
                    class="wallpaper-button"
                >
                    Open Light
                </a>

            </div>

        </div>



        <!-- DARK -->

        <div class="wallpaper-card">

            <div class="wallpaper-preview dark-preview">

                <div class="preview-content">

                    <div>🌙</div>

                    <span>
                        Dark
                    </span>

                </div>

            </div>


            <div class="wallpaper-info">

                <h2>Dark</h2>

                <p>
                    Dark and comfortable wallpaper
                </p>

                <a
                    href="dark-wallpaper.html"
                    class="wallpaper-button"
                >
                    Open Dark
                </a>

            </div>

        </div>



        <!-- CUSTOM -->

        <div class="wallpaper-card">

            <div class="wallpaper-preview upload-preview">

                <div class="preview-content">

                    <div>📤</div>

                    <span>
                        Custom
                    </span>

                </div>

            </div>


            <div class="wallpaper-info">

                <h2>
                    Custom Wallpaper
                </h2>

                <p>
                    Use your own wallpaper
                </p>

                <a
                    href="custom-wallpaper.html"
                    class="wallpaper-button"
                >
                    Open Custom
                </a>

            </div>

        </div>


    </div>


    <!-- BACK TO PROFILE -->

    <a
        href="profile.html"
        class="back-profile"
    >
        ← Back to Profile
    </a>

</div>


<!-- RESET WALLPAPER -->

<button
    id="resetWallpaper"
    class="reset-wallpaper"
>
    ↻ Reset Wallpaper
</button>


<script src="wallpaper.js"></script>

</body>

</html>
