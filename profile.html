<!DOCTYPE html>
<html>
<head>
    <title>Profile - Infinite X</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(180deg,#3B82F6,#A855F7,#EC4899);
        }

        .box{
            background:#0f172a;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
            width:300px;
            text-align:center;
            color:white;
        }

        h2{
            margin-bottom:10px;
        }

        .name{
            font-size:22px;
            font-weight:bold;
            color:#22D3EE;
            margin:15px 0;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            background:#ef4444;
            color:white;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#dc2626;
        }

        a{
            color:#22D3EE;
            text-decoration:none;
            display:block;
            margin-top:10px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Profile</h2>

        <div class="name" id="username">Guest</div>

        <button onclick="logout()">Logout</button>

        <a href="index.html">← Back to Home</a>
    </div>

    <script>
        // ambil user dari login
        let user = localStorage.getItem("user");

        if(user){
            document.getElementById("username").innerText = user;
        } else {
            document.getElementById("username").innerText = "Not Logged In";
        }

        function logout(){
            localStorage.removeItem("user");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
