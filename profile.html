<!DOCTYPE html>
<html>
<head>

<title>Profile - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1>

My Profile

</h1>

<!-- ========================= -->
<!-- PROFILE CARD -->
<!-- ========================= -->

<div class="profile-card">

<img

id="profileAvatar"

src="https://placehold.co/150"

class="profile-avatar"

>

<h2 id="profileName">

Guest

</h2>

<p id="joinDate">

Joined :
Unknown

</p>

</div>

<!-- ========================= -->
<!-- CONTINUE READING -->
<!-- ========================= -->

<div class="comic-card">

<h2>

📖 Continue Reading

</h2>

<div id="continueReading">

No Chapter

</div>

</div>

<!-- ========================= -->
<!-- HISTORY -->
<!-- ========================= -->

<div class="comic-card">

<h2>

📚 Reading History

</h2>

<div class="search-box">

<input

type="text"

id="searchHistory"

placeholder="🔍 Search history..."

>

</div>

<div id="historyList">

</div>

</div>

<!-- ========================= -->
<!-- FAVORITE -->
<!-- ========================= -->

<div class="comic-card">

<h2>

⭐ Favorite

</h2>

<p>

Coming Soon...

</p>

</div>

<!-- ========================= -->
<!-- ACHIEVEMENT -->
<!-- ========================= -->

<div class="comic-card">

<h2>

🏆 Achievement

</h2>

<ul>

<li>

First Reader

</li>

<li>

Read 10 Chapters

</li>

<li>

Coming Soon...

</li>

</ul>

</div>

<!-- ========================= -->
<!-- SETTINGS -->
<!-- ========================= -->

<div class="comic-card">

<h2>

⚙️ Settings

</h2>

<button

class="add-btn"

id="logoutBtn"

>

Logout

</button>

</div>

</div>
    
<script>

// =====================
// DEV PANEL
// =====================

if(

localStorage.getItem(
"developerLogged"
)==="true"

){

document.getElementById(
"devButton"
).style.display="block";

}

// =====================
// PROFILE
// =====================

let username=

localStorage.getItem(
"profileName"
)

||

"Guest";

let joinDate=

localStorage.getItem(
"profileJoinDate"
)

||

new Date()

.toLocaleDateString();

document.getElementById(

"profileName"

).innerText=

username;

document.getElementById(

"joinDate"

).innerText=

"Joined : "+joinDate;

// =====================
// CONTINUE READING
// =====================

let lastChapter=

localStorage.getItem(
"lastReadChapter"
);

if(lastChapter){

document.getElementById(

"continueReading"

).innerHTML=

`

<b>

${lastChapter}

</b>

<br><br>

<button

class="edit-btn"

onclick="continueReading()"

>

Continue

</button>

`;

}

else{

document.getElementById(

"continueReading"

).innerHTML=

"No Reading History";

}

// =====================
// CONTINUE
// =====================

function continueReading(){

localStorage.setItem(

"selectedChapter",

localStorage.getItem(

"lastReadChapter"

)

);

location.href=

"reader.html";

}

window.continueReading=

continueReading;

// =====================
// HISTORY
// =====================

let history=

JSON.parse(

localStorage.getItem(

"readingHistory"

)

)||[];

let historyHTML="";

if(history.length===0){

historyHTML=

`

<p>

No History

</p>

`;

}

else{

history.forEach(ch=>{

historyHTML+=`

<div class="comic-card history-card">

<h3>

${ch}

</h3>

</div>

`;

});

}

document.getElementById(

"historyList"

).innerHTML=

historyHTML;

// =====================
// SEARCH HISTORY
// =====================

document.getElementById(

"searchHistory"

)

.addEventListener(

"input",

e=>{

let keyword=

e.target.value

.toLowerCase();

document

.querySelectorAll(

".history-card"

)

.forEach(card=>{

card.style.display=

card.innerText

.toLowerCase()

.includes(keyword)

?

"block"

:

"none";

});

});

// =====================
// LOGOUT
// =====================

document.getElementById(

"logoutBtn"

)

.onclick=()=>{

if(

confirm(

"Logout?"

)

){

localStorage.removeItem(

"profileName"

);

location.href=

"index.html";

}

};

</script>
    
<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
