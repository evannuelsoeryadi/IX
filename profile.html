<!DOCTYPE html>

<html>
<head>

```
<title>Profile - Infinite X</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<nav>

    <a href="index.html">Home</a>
    <a href="comic.html">Comic</a>
    <a href="character.html">Character</a>
    <a href="#">About Us</a>
    <a href="profile.html">Profile</a>

</nav>

<div class="profile-page">

    <div class="profile-top">

        <div class="profile-card">

            <div class="avatar">
                👤
            </div>

            <h2 id="username">
                User
            </h2>

            <p id="role">
                Member
            </p>

            <button onclick="logout()">
                Logout
            </button>

        </div>

        <div class="menu-card">

            <div class="menu-icon">
                ⚙️
            </div>

            <h3>Settings</h3>

        </div>

        <div class="menu-card">

            <div class="menu-icon">
                📜
            </div>

            <h3>Purchase History</h3>

        </div>

        <div class="menu-card">

            <div class="menu-icon">
                ℹ️
            </div>

            <h3>About Infinite X</h3>

        </div>

    </div>

    <h2 class="history-title">
        Reading History
    </h2>

    <div class="history-container">

        <div class="history-card">
            Chapter 1
        </div>

        <div class="history-card">
            Chapter 2
        </div>

        <div class="history-card">
            Chapter 3
        </div>

        <div class="history-card">
            All History
        </div>

    </div>

    <div
        id="devPanel"
        style="display:none;"
    >

        <button
            onclick="location.href='developer.html'"
            class="dev-btn"
        >
            ⚙️ Developer Dashboard
        </button>

    </div>

</div>

<script>

    let user =
        localStorage.getItem(
            "user"
        );

    if(user){

        document.getElementById(
            "username"
        ).innerText = user;

    }

    if(

        localStorage.getItem(
            "developerLogged"
        ) === "true"

    ){

        document.getElementById(
            "role"
        ).innerText =
            "Owner";

        document.getElementById(
            "devPanel"
        ).style.display =
            "block";

    }

    function logout(){

        localStorage.removeItem(
            "user"
        );

        localStorage.removeItem(
            "developerLogged"
        );

        window.location.href =
            "index.html";

    }

</script>
```

</body>
</html>
