<!DOCTYPE html>

<html>
<head>
    <title>Login - Infinite X</title>

<style>

    body{
        margin:0;
        font-family:Arial;
        height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;

        background:linear-gradient(
            180deg,
            #3B82F6,
            #A855F7,
            #EC4899
        );
    }

    .box{
        width:320px;
        padding:40px;

        background:#0f172a;
        border-radius:15px;

        box-shadow:0 0 20px rgba(0,0,0,0.5);

        text-align:center;
    }

    h2{
        color:white;
        margin-bottom:20px;
    }

    input{
        width:100%;
        padding:12px;
        margin:10px 0;

        border:none;
        border-radius:8px;

        outline:none;
        box-sizing:border-box;
    }

    button{
        width:100%;
        padding:12px;

        margin-top:10px;

        border:none;
        border-radius:8px;

        background:#3B82F6;
        color:white;

        font-weight:bold;
        cursor:pointer;

        transition:0.3s;
    }

    button:hover{
        background:#2563eb;
    }

    p{
        color:white;
        font-size:12px;
        margin-top:15px;
    }

    a{
        color:#22D3EE;
        text-decoration:none;
    }

    .show-pass{
        color:white;
        font-size:14px;

        display:flex;
        justify-content:center;
        align-items:center;

        gap:8px;
        margin-top:10px;
    }

    .show-pass input{
        width:auto;
        margin:0;
    }

</style>
```

</head>

<body>

```
<div class="box">

    <h2>Login</h2>

    <input
        type="text"
        id="user"
        placeholder="Username"
    >

    <input
        type="password"
        id="pass"
        placeholder="Password"
    >

    <label class="show-pass">

        <input
            type="checkbox"
            onclick="togglePassword()"
        >

        Show Password

    </label>

    <button onclick="login()">
        Login
    </button>

    <a href="member.html">
        ← Back
    </a>

    <p>
        Belum punya akun?
        <a href="signup.html">
            Sign Up
        </a>
    </p>

</div>

<script>

    function login(){

        let user =
            document.getElementById("user").value;

        let pass =
            document.getElementById("pass").value;

        let accounts =
            JSON.parse(
                localStorage.getItem("accounts")
            ) || [];

        let foundAccount =
            accounts.find(function(account){

                return (
                    account.username === user &&
                    account.password === pass
                );

            });

        if(foundAccount){

            localStorage.setItem(
                "user",
                user
            );

            window.location.href =
                "home.html";

        }else{

            alert(
                "Username atau Password salah!"
            );

        }

    }

    function togglePassword(){

        let pass =
            document.getElementById("pass");

        if(pass.type === "password"){

            pass.type = "text";

        }else{

            pass.type = "password";

        }

    }

</script>
```

</body>
</html>
