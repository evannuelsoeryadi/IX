<!DOCTYPE html>
<html>
<head>
    <title>Login - Infinite X</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(180deg,#3B82F6,#A855F7,#EC4899);
        }

        .box{
            width:320px;
            padding:40px;

            background:#0f172a;
            border-radius:15px;

            box-shadow:0 0 20px rgba(0,0,0,0.5);
            text-align:center;
        }

        h2{
            color:white;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;

            border:none;
            border-radius:8px;

            outline:none;
        }

        button{
            width:100%;
            padding:12px;

            margin-top:10px;

            border:none;
            border-radius:8px;

            background:#3B82F6;
            color:white;

            font-weight:bold;
            cursor:pointer;

            transition:0.3s;
        }

        button:hover{
            background:#2563eb;
        }

        p{
            color:white;
            font-size:12px;
            margin-top:15px;
        }

        a{
            color:#22D3EE;
            text-decoration:none;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Login</h2>

        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">
        <label>
            <input type="checkbox" onclick="togglePassword()">
            Show Password
        </label>
        <button onclick="login()">Login</button>

        <p>Belum punya akun? <a href="#">Sign Up</a></p>
    </div>
    function togglePassword(){

    let pass =
        document.getElementById("pass");

    if(pass.type === "password"){
        pass.type = "text";
    }else{
        pass.type = "password";
    }

}
    <script>

    function login(){

        let user =
            document.getElementById("user").value;

        let pass =
            document.getElementById("pass").value;

        let savedUser =
            localStorage.getItem("accountUser");

        let savedPass =
            localStorage.getItem("accountPass");

        if(user === savedUser &&
           pass === savedPass){

            localStorage.setItem(
                "user",
                user
            );

            window.location.href =
                "index.html";

        }else{

            alert(
                "Username atau Password salah!"
            );

        }

    }

</script>

</body>
</html>
