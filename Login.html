<!DOCTYPE html>
<html>
<head>
    <title>Login - Infinite X</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(180deg,#3B82F6,#A855F7,#EC4899);
        }

        .box{
            background:#0f172a;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
            width:300px;
            text-align:center;
        }

        h2{
            color:white;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
            border:none;
            border-radius:8px;
            outline:none;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            background:#3B82F6;
            color:white;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2563eb;
        }

        p{
            color:white;
            margin-top:15px;
            font-size:12px;
        }

        a{
            color:#22D3EE;
            text-decoration:none;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>Login</h2>

        <input type="text" id="user" placeholder="Username">
        <input type="password" id="pass" placeholder="Password">

        <button onclick="login()">Login</button>

        <p>Belum punya akun? <a href="#">Sign Up</a></p>
    </div>

    <script>
        function login(){
            let user = document.getElementById("user").value;

            if(user === ""){
                alert("Isi username dulu!");
                return;
            }

            // SIMPAN USER (dummy login)
            localStorage.setItem("user", user);

            // balik ke homepage
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
