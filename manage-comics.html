<!DOCTYPE html>

<html>
<head>

<title>Manage Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="#">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
    href="developer.html"
    id="devButton"
>
    ⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>Manage Comics</h1>

<p class="chapter-count">
    Total Chapters: 4
</p>

<button
    class="add-btn"
    onclick="openModal()"
>
    + Add Chapter
</button>

<div
    id="addChapterModal"
    class="modal"
>

<div class="modal-content">

    <h2>Add Chapter</h2>

    <input
        type="text"
        id="chapterTitle"
        placeholder="Chapter Title"
    >

    <textarea
        id="chapterDesc"
        placeholder="Chapter Description"
    ></textarea>

    <div class="modal-buttons">

        <button onclick="saveChapter()">
            Save
        </button>

        <button
            onclick="closeModal()"
            class="delete-btn"
        >
            Cancel
        </button>

    </div>

</div>

</div>

<script>

    if(
        localStorage.getItem(
            "developerLogged"
        ) !== "true"
    ){

        window.location.href =
            "developer-login.html";

    }

    function openModal(){

        document.getElementById(
            "addChapterModal"
        ).style.display = "flex";

    }

    function closeModal(){

        document.getElementById(
            "addChapterModal"
        ).style.display = "none";

    }

    function saveChapter(){

        let title =
            document.getElementById(
                "chapterTitle"
            ).value;

        let desc =
            document.getElementById(
                "chapterDesc"
            ).value;

        if(
            title === "" ||
            desc === ""
        ){

            alert(
                "Lengkapi data dulu!"
            );

            return;

        }

        alert(
            "Chapter berhasil ditambahkan!"
        );

        closeModal();

    }

</script>

</body>
</html>
