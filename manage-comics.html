```html
<!DOCTYPE html>
<html>
<head>

<title>Manage Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1>Manage Comics</h1>

<p class="chapter-count">

Total Chapters :
<span id="chapterCount">
0
</span>

</p>

<button
class="add-btn"
onclick="openModal()"
>

+ Add Chapter

</button>

<div id="chapterList">

</div>

</div>

<div
id="addChapterModal"
class="modal"
>

<div class="modal-content">

<h2>Add Chapter</h2>

<input
type="text"
id="chapterTitle"
placeholder="Chapter Title"
>

<textarea
id="chapterDesc"
placeholder="Chapter Description"
></textarea>

<input
type="number"
id="chapterPrice"
placeholder="Price (0 = Free)"
>

<input
type="number"
id="chapterPages"
placeholder="Total Pages"
>

<input
type="file"
id="chapterCover"
accept="image/*"
>

<div class="modal-buttons">

<button
onclick="saveChapter()"
class="edit-btn"
>

Save

</button>

<button
onclick="closeModal()"
class="delete-btn"
>

Cancel

</button>

</div>

</div>

</div>

<script>

if(
localStorage.getItem(
"developerLogged"
) !== "true"
){

window.location.href =
"developer-login.html";

}

let chapters =
JSON.parse(
localStorage.getItem(
"infinite_x_chapters"
)
) || [];

renderChapters();

function renderChapters(){

let container =
document.getElementById(
"chapterList"
);

container.innerHTML = "";

document.getElementById(
"chapterCount"
).innerText =
chapters.length;

chapters.forEach(
(chapter,index)=>{

container.innerHTML += `

<div class="chapter-card">

<div>

<h2>
${chapter.title}
</h2>

<p>
${chapter.desc}
</p>

<p>
Price :
${chapter.price == 0 ? "Free" : chapter.price}
</p>

<p>
Pages :
${chapter.pages}
</p>

</div>

<div class="action-buttons">

<button
class="edit-btn"
>

Edit

</button>

<button
class="delete-btn"
onclick="deleteChapter(${index})"
>

Delete

</button>

</div>

</div>

`;

});

}

function openModal(){

document.getElementById(
"addChapterModal"
).style.display =
"flex";

}

function closeModal(){

document.getElementById(
"addChapterModal"
).style.display =
"none";

}

function saveChapter(){

let title =
document.getElementById(
"chapterTitle"
).value;

let desc =
document.getElementById(
"chapterDesc"
).value;

let price =
document.getElementById(
"chapterPrice"
).value;

let pages =
document.getElementById(
"chapterPages"
).value;

if(
title == "" ||
desc == ""
){

alert(
"Lengkapi data dulu!"
);

return;

}

chapters.push({

title:title,

desc:desc,

price:Number(price),

pages:Number(pages),

cover:"",
pageImages:[]

});

localStorage.setItem(

"infinite_x_chapters",

JSON.stringify(
chapters
)

);

renderChapters();

closeModal();

}

function deleteChapter(index){

chapters.splice(
index,
1
);

localStorage.setItem(

"infinite_x_chapters",

JSON.stringify(
chapters
)

);

renderChapters();

}

</script>

</body>
</html>
```
