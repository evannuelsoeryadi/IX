<!DOCTYPE html>
<html>
<head>

<title>Manage Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a href="developer.html" id="devButton">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>Manage Comics</h1>

<p class="chapter-count">
Total Chapters :
<span id="chapterCount">0</span>
</p>

<button
class="add-btn"
onclick="window.location.href='manage-pages.html'"
>
+ Add Chapter
</button>

<div id="chapterList"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE CONFIG
// =====================
const firebaseConfig = {
  apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
  authDomain: "infinite-x-f37a2.firebaseapp.com",
  projectId: "infinite-x-f37a2",
  storageBucket: "infinite-x-f37a2.firebasestorage.app",
  messagingSenderId: "32543278362",
  appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

// INIT
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;

console.log("Firebase CONNECTED ✅");

// =====================
// LOAD CHAPTERS
// =====================
async function loadChapters(){

    let container = document.getElementById("chapterList");
    container.innerHTML = "";

    try {

        let snapshot = await getDocs(collection(db, "chapters"));

        let chapters = [];

        snapshot.forEach(docSnap => {
            chapters.push({
                id: docSnap.id,
                ...docSnap.data()
            });
        });

        document.getElementById("chapterCount").innerText = chapters.length;

        chapters.forEach((chapter)=>{

            container.innerHTML += `
            <div class="chapter-card">

                <img src="${chapter.cover || "https://placehold.co/120x170"}" class="chapter-cover">

                <div class="chapter-info">

                    <h2>${chapter.title}</h2>
                    <p>${chapter.desc}</p>
                    <p>Price : ${chapter.price == 0 ? "Free" : chapter.price}</p>
                    <p>Pages : ${chapter.pages}</p>

                </div>

                <div class="action-buttons">

                    <button class="edit-btn" onclick="editChapter('${chapter.id}')">
                        Edit
                    </button>

                    <button class="delete-btn" onclick="deleteChapter('${chapter.id}')">
                        Delete
                    </button>

                </div>

            </div>
            `;
        });

    } catch (e) {
        console.error("Load error:", e);
    }
}

// =====================
// DELETE FIREBASE
// =====================
async function deleteChapter(id){

    let confirmDelete = confirm("Yakin mau hapus chapter ini?");
    if(!confirmDelete) return;

    try {
        await deleteDoc(doc(db, "chapters", id));
        console.log("Deleted ✅");
        loadChapters();
    } catch (e) {
        console.error("Delete error:", e);
    }
}

// =====================
// EDIT FLOW (NEXT PAGE)
// =====================
function editChapter(id){
    localStorage.setItem("editingChapter", id);
    window.location.href = "manage-pages.html";
}

// expose global
window.deleteChapter = deleteChapter;
window.editChapter = editChapter;

// INIT
loadChapters();

</script>

</body>
</html>
