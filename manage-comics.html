<!DOCTYPE html>
<html>
<head>

<title>Manage Comics - Infinite X</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="comic.html">Comic</a>
    <a href="#">Character</a>
    <a href="#">About Us</a>
    <a href="profile.html">Profile</a>

    <a href="developer.html" id="devButton">⚙️ Dev Panel</a>
</nav>

<div class="manage-container">

    <h1>Manage Comics</h1>

    <p class="chapter-count">Total Chapters: 0</p>

    <button class="add-btn" onclick="openModal()">
        + Add Chapter
    </button>

    <div id="chapterList"></div>

</div>

<!-- MODAL -->
<div id="addChapterModal" class="modal">

    <div class="modal-content">

        <h2>Add Chapter</h2>

        <input type="text" id="chapterTitle" placeholder="Chapter Title">
        <input type="file" id="chapterCover" accept="image/*">
        <input type="number" id="chapterPrice" placeholder="Price (0 = Free)">
        <input type="number" id="chapterPages" placeholder="Total Pages">
        <textarea id="chapterDesc" placeholder="Chapter Description"></textarea>

        <div class="modal-buttons">
            <button class="btn-primary" onclick="saveChapter()">Save</button>
            <button class="btn-danger" onclick="closeModal()">Cancel</button>
        </div>

    </div>

</div>

<script>

/////////////////////////////////////////////////////
// 🔐 DEV CHECK
/////////////////////////////////////////////////////

if(localStorage.getItem("developerLogged") !== "true"){
    window.location.href = "developer-login.html";
}

/////////////////////////////////////////////////////
// 📦 COMIC SYSTEM
/////////////////////////////////////////////////////

let comics = JSON.parse(localStorage.getItem("infinite_x_comics")) || [];

if(comics.length === 0){
    comics.push({
        id: "comic_1",
        title: "Default Comic",
        chapters: []
    });
    saveComics();
}

let currentComicId = "comic_1";

function saveComics(){
    localStorage.setItem("infinite_x_comics", JSON.stringify(comics));
}

function getCurrentComic(){
    return comics.find(c => c.id === currentComicId);
}

/////////////////////////////////////////////////////
// 📊 RENDER CHAPTERS
/////////////////////////////////////////////////////

function renderChapters(){

    let comic = getCurrentComic();
    let list = document.getElementById("chapterList");
    list.innerHTML = "";

    let chapters = comic.chapters;

    document.querySelector(".chapter-count").innerText =
        "Total Chapters: " + chapters.length;

    chapters.forEach((c, i) => {

        list.innerHTML += `
            <div class="chapter-card">

                <div style="display:flex; gap:15px; align-items:center;">

                    ${c.cover ? `
                        <img src="${c.cover}" style="width:60px;height:80px;border-radius:8px;object-fit:cover;">
                    ` : ""}

                    <div>
                        <h2>${c.title}</h2>
                        <p>${c.desc}</p>

                        <small style="color:#aaa;">
                            Pages: ${c.pages || 0} | Price: ${c.price == 0 ? "Free" : c.price}
                        </small>
                    </div>

                </div>

                <div class="action-buttons">

                    <button class="edit-btn">Edit</button>

                    <button class="btn-danger" onclick="deleteChapter(${i})">
                        Delete
                    </button>

                </div>

            </div>
        `;
    });

    saveComics();
}

/////////////////////////////////////////////////////
// ➕ MODAL
/////////////////////////////////////////////////////

function openModal(){
    document.getElementById("addChapterModal").style.display = "flex";
}

function closeModal(){
    document.getElementById("addChapterModal").style.display = "none";
}

/////////////////////////////////////////////////////
// 💾 SAVE CHAPTER
/////////////////////////////////////////////////////

function saveChapter(){

    let comic = getCurrentComic();

    let title = document.getElementById("chapterTitle").value;
    let desc = document.getElementById("chapterDesc").value;
    let price = document.getElementById("chapterPrice").value;
    let pages = document.getElementById("chapterPages").value;
    let coverFile = document.getElementById("chapterCover").files[0];

    if(!title || !desc){
        alert("Lengkapi data dulu!");
        return;
    }

    let reader = new FileReader();

    reader.onload = function(){

        comic.chapters.push({
            id: "ch_" + Date.now(),
            title,
            desc,
            cover: reader.result,
            price: Number(price),
            pages: Number(pages),
            pageImages: []
        });

        saveComics();
        renderChapters();
        closeModal();

        document.getElementById("chapterTitle").value = "";
        document.getElementById("chapterDesc").value = "";
        document.getElementById("chapterPrice").value = "";
        document.getElementById("chapterPages").value = "";
        document.getElementById("chapterCover").value = "";
    };

    if(coverFile){
        reader.readAsDataURL(coverFile);
    } else {
        reader.onload();
    }
}

/////////////////////////////////////////////////////
// 🗑️ DELETE
/////////////////////////////////////////////////////

function deleteChapter(index){
    let comic = getCurrentComic();
    comic.chapters.splice(index, 1);
    saveComics();
    renderChapters();
}

/////////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////////

renderChapters();

</script>

</body>
</html>
