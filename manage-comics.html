<!DOCTYPE html>
<html>
<head>

<title>Comic - Infinite X</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>
    <a href="index.html">Home</a>
    <a href="comic.html">Comic</a>
    <a href="character.html">Character</a>
    <a href="#">About Us</a>
    <a href="profile.html">Profile</a>
    <a 
            href="developer.html"
            id="devButton"
            style="display:none;"
        >
            ⚙️ Dev Panel
    </a>
</nav>

<div class="comic-container">

    <!-- 📚 COMIC LIST -->
    <div id="comicList"></div>

    <!-- 📖 CHAPTER LIST -->
    <div id="chapterView" style="display:none;"></div>

</div>

<script>

/////////////////////////////////////////////////////
// 📦 LOAD DATA
/////////////////////////////////////////////////////

let comics = JSON.parse(localStorage.getItem("infinite_x_comics")) || [];

let selectedComicId = localStorage.getItem("selectedComicId") || null;

/////////////////////////////////////////////////////
// 📚 RENDER COMIC LIST
/////////////////////////////////////////////////////

function renderComics(){

    let container = document.getElementById("comicList");
    container.innerHTML = "";

    comics.forEach(comic => {

        container.innerHTML += `
            <div class="comic-card" onclick="openComic('${comic.id}')"
                style="padding:15px; border:1px solid #333; margin:10px; cursor:pointer;">

                <h2>${comic.title}</h2>
                <p>Total Chapters: ${comic.chapters.length}</p>

            </div>
        `;
    });
}

/////////////////////////////////////////////////////
// 📖 OPEN COMIC → CHAPTER VIEW
/////////////////////////////////////////////////////

function openComic(id){

    localStorage.setItem("selectedComicId", id);
    selectedComicId = id;

    document.getElementById("comicList").style.display = "none";
    document.getElementById("chapterView").style.display = "block";

    renderChapters();
}

/////////////////////////////////////////////////////
// 📖 RENDER CHAPTERS
/////////////////////////////////////////////////////

function renderChapters(){

    let comic = comics.find(c => c.id === selectedComicId);
    let container = document.getElementById("chapterView");

    container.innerHTML = "";

    if(!comic){
        container.innerHTML = "<p>No comic found</p>";
        return;
    }

    container.innerHTML += `
        <button onclick="backToComics()" style="margin-bottom:10px;">
            ⬅ Back
        </button>
    `;

    comic.chapters.forEach(ch => {

        container.innerHTML += `
            <div class="chapter-card"
                onclick="openChapter('${ch.id}')"
                style="padding:15px; border:1px solid #444; margin:10px; cursor:pointer;">

                <h3>${ch.title}</h3>
                <p>${ch.desc}</p>

                <small>
                    Pages: ${ch.pages} | Price: ${ch.price == 0 ? "Free" : ch.price}
                </small>

            </div>
        `;
    });
}

/////////////////////////////////////////////////////
// 🔙 BACK
/////////////////////////////////////////////////////

function backToComics(){
    document.getElementById("chapterView").style.display = "none";
    document.getElementById("comicList").style.display = "block";
}

/////////////////////////////////////////////////////
// 📖 OPEN CHAPTER (NEXT STEP HOOK)
/////////////////////////////////////////////////////

function openChapter(chapterId){

    localStorage.setItem("selectedChapterId", chapterId);

    // sementara placeholder (STEP 6 nanti)
    alert("Chapter opened: " + chapterId + "\nNEXT: Reader System");
}

/////////////////////////////////////////////////////
// INIT
/////////////////////////////////////////////////////

renderComics();

if(

        localStorage.getItem(
            "developerLogged"
        ) === "true"

    ){

        document
        .getElementById(
            "devButton"
        )
        .style.display =
            "block";

    }

    function saveChapter(){

    let comic = getCurrentComic();
    if(!comic) return;

    let title = document.getElementById("chapterTitle").value;
    let desc = document.getElementById("chapterDesc").value;
    let price = document.getElementById("chapterPrice").value;
    let pages = document.getElementById("chapterPages").value;
    let coverFile = document.getElementById("chapterCover").files[0];

    if(!title || !desc){
        alert("Lengkapi data dulu!");
        return;
    }

    function pushChapter(coverData){

        comic.chapters.push({
            id: "ch_" + Date.now(),
            title,
            desc,
            cover: coverData || "",
            price: Number(price) || 0,
            pages: Number(pages) || 0,
            pageImages: []
        });

        saveComics();
        renderChapters();
        closeModal();

        // reset
        document.getElementById("chapterTitle").value = "";
        document.getElementById("chapterDesc").value = "";
        document.getElementById("chapterPrice").value = "";
        document.getElementById("chapterPages").value = "";
        document.getElementById("chapterCover").value = "";
    }

    if(coverFile){

        let reader = new FileReader();

        reader.onload = function(){
            pushChapter(reader.result);
        };

        reader.readAsDataURL(coverFile);

    } else {
        pushChapter("");
    }
}

</script>

</body>
</html>
