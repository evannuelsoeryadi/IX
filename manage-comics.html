<script>

if(localStorage.getItem("developerLogged") !== "true"){
    window.location.href = "developer-login.html";
}

// =====================
// FIREBASE / LOCAL HYBRID
// =====================
let chapters = [];

// =====================
// RENDER CHAPTERS
// =====================
function renderChapters(){

    let container = document.getElementById("chapterList");
    container.innerHTML = "";

    document.getElementById("chapterCount").innerText = chapters.length;

    chapters.forEach((chapter,index)=>{

        container.innerHTML += `
        <div class="chapter-card">

            <img src="${chapter.cover || "https://placehold.co/120x170"}" class="chapter-cover">

            <div class="chapter-info">

                <h2>${chapter.title}</h2>

                <p>${chapter.desc}</p>

                <p>Price : ${chapter.price == 0 ? "Free" : chapter.price}</p>

                <p>Pages : ${chapter.pages}</p>

            </div>

            <div class="action-buttons">

                <button class="edit-btn" onclick="editChapter('${chapter.id || index}')">
                    Edit
                </button>

                <button class="delete-btn" onclick="deleteChapter('${chapter.id || index}')">
                    Delete
                </button>

            </div>

        </div>
        `;
    });
}

// =====================
// LOAD FROM FIREBASE
// =====================
async function loadChapters(){

    try {
        const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js");

        let snapshot = await getDocs(collection(window.db, "chapters"));

        chapters = [];

        snapshot.forEach(doc => {
            chapters.push({
                id: doc.id,
                ...doc.data()
            });
        });

        renderChapters();

        console.log("Loaded from Firebase ✅");

    } catch (e) {
        console.error("Firebase load error:", e);

        // fallback localStorage
        chapters = JSON.parse(localStorage.getItem("infinite_x_chapters")) || [];
        renderChapters();
    }
}

// =====================
// EDIT CHAPTER
// =====================
function editChapter(id){
    localStorage.setItem("editingChapter", id);
    window.location.href = "manage-pages.html";
}

// =====================
// DELETE CHAPTER (LOCAL ONLY FOR NOW SAFE MODE)
// =====================
function deleteChapter(index){

    let confirmDelete = confirm("Yakin mau hapus chapter ini?");
    if(!confirmDelete) return;

    chapters.splice(index,1);

    localStorage.setItem("infinite_x_chapters", JSON.stringify(chapters));

    renderChapters();
}

// =====================
// INIT
// =====================
loadChapters();

</script>
