<!DOCTYPE html>

<html>
<head>

<title>Manage Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<a href="index.html">Home</a> <a href="comic.html">Comic</a> <a href="#">Character</a> <a href="#">About Us</a> <a href="profile.html">Profile</a>

<a href="developer.html" id="devButton">
    ⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">


<h1>Manage Comics</h1>

<p class="chapter-count">
    Total Chapters: 0
</p>

<button class="add-btn" onclick="openModal()">
    + Add Chapter
</button>

<div id="chapterList"></div>


</div>

<!-- MODAL -->

<div id="addChapterModal" class="modal">


<div class="modal-content">

    <h2>Add Chapter</h2>

    <input
        type="text"
        id="chapterTitle"
        placeholder="Chapter Title"
    >

    <input
        type="file"
        id="chapterCover"
        accept="image/*"
    >

    <input
        type="number"
        id="chapterPrice"
        placeholder="Price (0 = Free)"
    >

    <input
        type="number"
        id="chapterPages"
        placeholder="Total Pages"
    >

    <textarea
        id="chapterDesc"
        placeholder="Chapter Description"
    ></textarea>

    <div class="modal-buttons">

        <button onclick="saveChapter()">
            Save
        </button>

        <button onclick="closeModal()" class="delete-btn">
            Cancel
        </button>

    </div>

</div>


</div>

<script>

if(
    localStorage.getItem("developerLogged") !== "true"
){
    window.location.href = "developer-login.html";
}

let totalChapter = 0;

function openModal(){
    document.getElementById("addChapterModal").style.display = "flex";
}

function closeModal(){
    document.getElementById("addChapterModal").style.display = "none";
}

function saveChapter(){

    let title = document.getElementById("chapterTitle").value;
    let desc = document.getElementById("chapterDesc").value;
    let price = document.getElementById("chapterPrice").value;
    let pages = document.getElementById("chapterPages").value;
    let cover = document.getElementById("chapterCover").files[0];

    if(!title || !desc){
        alert("Lengkapi data dulu!");
        return;
    }

    totalChapter++;

    document.querySelector(".chapter-count").innerText =
        "Total Chapters: " + totalChapter;

    let card = document.createElement("div");
    card.className = "chapter-card";

    let coverURL = cover ? URL.createObjectURL(cover) : "";

    card.innerHTML = `

        <div style="display:flex; gap:15px; align-items:center;">

            ${coverURL ? `<img src="${coverURL}" style="width:60px;height:80px;border-radius:8px;object-fit:cover;">` : ""}

            <div>

                <h2>${title}</h2>

                <p>${desc}</p>

                <small style="color:#aaa;">
                    Pages: ${pages || 0} | Price: ${price == 0 ? "Free" : price}
                </small>

            </div>

        </div>

        <div class="action-buttons">

            <button class="edit-btn">Edit</button>

            <button class="delete-btn" onclick="deleteChapter(this)">Delete</button>

        </div>

    `;

    document.getElementById("chapterList").appendChild(card);

    closeModal();

    document.getElementById("chapterTitle").value = "";
    document.getElementById("chapterDesc").value = "";
    document.getElementById("chapterPrice").value = "";
    document.getElementById("chapterPages").value = "";
    document.getElementById("chapterCover").value = "";

}

function deleteChapter(btn){

    btn.closest(".chapter-card").remove();

    totalChapter--;

    document.querySelector(".chapter-count").innerText =
        "Total Chapters: " + totalChapter;

}

</script>

</body>
</html>
