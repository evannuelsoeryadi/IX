<!DOCTYPE html>
<html>
<head>

<title>Manage Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>

<a href="developer.html" id="devButton">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>Manage Comics</h1>

<p class="chapter-count">
Total Chapters :
<span id="chapterCount">0</span>
</p>

<button
class="add-btn"
onclick="window.location.href='manage-pages.html'"
>
+ Add Chapter
</button>

<div id="chapterList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


// =====================
// FIREBASE CONFIG
// =====================

const firebaseConfig = {

    apiKey:
    "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",

    authDomain:
    "infinite-x-f37a2.firebaseapp.com",

    projectId:
    "infinite-x-f37a2",

    storageBucket:
    "infinite-x-f37a2.firebasestorage.app",

    messagingSenderId:
    "32543278362",

    appId:
    "1:32543278362:web:54e231f17c92596888d8a3"

};


// =====================
// INITIALIZE FIREBASE
// =====================

const app =
    initializeApp(
        firebaseConfig
    );

const db =
    getFirestore(app);


// =====================
// LOAD CHAPTERS
// =====================

async function loadChapters(){

    const container =
        document.getElementById(
            "chapterList"
        );

    container.innerHTML = "";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "chapters"
                )
            );


        const chapters = [];


        snapshot.forEach(
            docSnap => {

                chapters.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        // =====================
        // CHAPTER COUNT
        // =====================

        document.getElementById(
            "chapterCount"
        ).innerText =
            chapters.length;


        // =====================
        // EMPTY
        // =====================

        if(chapters.length === 0){

            container.innerHTML = `

                <div class="comic-card">

                    <h2>
                        No Chapters Yet
                    </h2>

                    <p>
                        Add your first chapter.
                    </p>

                </div>

            `;

            return;

        }


        // =====================
        // RENDER
        // =====================

        chapters.forEach(
            chapter => {

                container.innerHTML += `

                    <div class="chapter-card">

                        <img
                            src="${
                                chapter.cover ||
                                "https://placehold.co/120x170"
                            }"
                            class="chapter-cover"
                        >

                        <div class="chapter-info">

                            <h2>
                                ${chapter.title || "Untitled"}
                            </h2>

                            <p>
                                ${chapter.desc || "No description."}
                            </p>

                            <p>
                                Price :
                                ${
                                    chapter.price == 0 ||
                                    !chapter.price
                                    ? "Free"
                                    : chapter.price
                                }
                            </p>

                            <p>
                                Pages :
                                ${chapter.pages || 0}
                            </p>

                        </div>


                        <div class="action-buttons">

                            <button
                                class="edit-btn"
                                onclick="editChapter('${chapter.id}')"
                            >
                                Edit
                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteChapter('${chapter.id}')"
                            >
                                Delete
                            </button>

                        </div>

                    </div>

                `;

            }
        );

    }

    catch(error){

        console.error(
            "Load chapters error:",
            error
        );


        container.innerHTML = `

            <div class="comic-card">

                <h2>
                    Failed to Load Chapters
                </h2>

                <p>
                    Check Firebase connection.
                </p>

            </div>

        `;

    }

}


// =====================
// DELETE CHAPTER
// =====================

async function deleteChapter(id){

    const confirmDelete =
        confirm(
            "Yakin mau hapus chapter ini?"
        );


    if(!confirmDelete)
        return;


    try{

        await deleteDoc(

            doc(
                db,
                "chapters",
                id
            )

        );


        alert(
            "Chapter berhasil dihapus!"
        );


        await loadChapters();

    }

    catch(error){

        console.error(
            "Delete chapter error:",
            error
        );


        alert(
            "Gagal menghapus chapter!"
        );

    }

}


// =====================
// EDIT CHAPTER
// =====================

function editChapter(id){

    sessionStorage.setItem(

        "editingChapter",

        id

    );


    window.location.href =
        "manage-pages.html";

}


// =====================
// GLOBAL FUNCTIONS
// =====================

window.deleteChapter =
    deleteChapter;

window.editChapter =
    editChapter;


// =====================
// INIT
// =====================

loadChapters();

</script>

    <div id="themeFade"></div>

<script src="theme.js"></script>
    
</body>
</html>
