<!DOCTYPE html>
<html>
<head>

<title>Manage Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1>

Manage Comics

</h1>

<p class="chapter-count">

Total Chapters :
<span id="chapterCount">

0

</span>

</p>

<button
class="add-btn"
onclick="window.location.href='manage-pages.html'"
>

+ Add Chapter

</button>

<div id="chapterList">

</div>

</div>

<script>

if(

localStorage.getItem(
"developerLogged"
) !== "true"

){

window.location.href =
"developer-login.html";

}

let chapters =

JSON.parse(

localStorage.getItem(
"infinite_x_chapters"

)

) || [];

renderChapters();

function renderChapters(){

let container =

document.getElementById(
"chapterList"
);

container.innerHTML = "";

document.getElementById(
"chapterCount"
).innerText =
chapters.length;

chapters.forEach(
(chapter,index)=>{

container.innerHTML += `

<div class="chapter-card">

<img
src="${
chapter.cover || "https://placehold.co/120x170"
}
class="chapter-cover"
>

<div class="chapter-info">

<h2>

${chapter.title}

</h2>

<p>

${chapter.desc}

</p>

<p>

Price :
${chapter.price == 0 ? "Free" : chapter.price}

</p>

<p>

Pages :
${chapter.pages}

</p>

</div>

<div class="action-buttons">

<button
class="edit-btn"
>

Edit

</button>

<button
class="delete-btn"
onclick="deleteChapter(${index})"
>

Delete

</button>

</div>

</div>

`;

});

}

function deleteChapter(index){

chapters.splice(
index,
1
);

localStorage.setItem(

"infinite_x_chapters",

JSON.stringify(
chapters)

);

renderChapters();

}

</script>

</body>
</html>
