>
    ← Back to Wallpaper

<!-- LIGHT WALLPAPER -->

<div class="light-wallpaper-container">


    <div class="light-header">

        <h1>
            Light Wallpaper
        </h1>

        <p>
            Choose your preferred light wallpaper
        </p>

    </div>



    <!-- WALLPAPER GRID -->

    <div
        class="light-grid"
        id="lightWallpaperGrid"
    >


        <!-- SAKURA -->

        <div class="light-card">

            <img
                src="Sakura sunset.png"
                alt="Sakura Sunset"
            >

            <div class="light-card-info">

                <h2>
                    Sakura Sunset
                </h2>

                <button
                    class="use-wallpaper"
                    data-wallpaper="Sakura sunset.png"
                >
                    Use Wallpaper
                </button>

            </div>

        </div>



        <!-- MORNING CITY -->

        <div class="light-card">

            <img
                src="Morning city.png"
                alt="Morning City"
            >

            <div class="light-card-info">

                <h2>
                    Morning City
                </h2>

                <button
                    class="use-wallpaper"
                    data-wallpaper="Morning city.png"
                >
                    Use Wallpaper
                </button>

            </div>

        </div>



        <!-- BLUE SKY -->

        <div class="light-card">

            <img
                src="Blue sky.png"
                alt="Blue Sky"
            >

            <div class="light-card-info">

                <h2>
                    Blue Sky
                </h2>

                <button
                    class="use-wallpaper"
                    data-wallpaper="Blue sky.png"
                >
                    Use Wallpaper
                </button>

            </div>

        </div>



        <!-- CLOUD DAY -->

        <div class="light-card">

            <img
                src="Cloud day.png"
                alt="Cloud Day"
            >

            <div class="light-card-info">

                <h2>
                    Cloud Day
                </h2>

                <button
                    class="use-wallpaper"
                    data-wallpaper="Cloud day.png"
                >
                    Use Wallpaper
                </button>

            </div>

        </div>



        <!-- WHITE -->

        <div class="light-card">

            <img
                src="White.png"
                alt="White"
            >

            <div class="light-card-info">

                <h2>
                    White
                </h2>

                <button
                    class="use-wallpaper"
                    data-wallpaper="White.png"
                >
                    Use Wallpaper
                </button>

            </div>

        </div>


    </div>


</div>



<!-- FIREBASE / JAVASCRIPT -->

<script
    type="module"
    src="light-wallpaper.js"
>
</script>


</body>

</html>
