
<!DOCTYPE html>
<html>
<head>

<title>Manage Characters - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>
<a href="developer.html">⚙️ Dev Panel</a>

</nav>

<div class="manage-container">

<h1>

Manage Characters

</h1>

<div class="character-form">

<input
type="text"
id="charName"
placeholder="Character Name"
>

<input
type="text"
id="charRole"
placeholder="Character Role"
>

<input
type="file"
id="charImage"
accept="image/*"

>


<textarea
id="charDesc"
placeholder="Character Description"
></textarea>

<button
class="add-btn"
onclick="addCharacter()"
>

+ Add Character

</button>

</div>

<br>

<div id="characterList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    addDoc,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================

const firebaseConfig = {
    apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
    authDomain: "infinite-x-f37a2.firebaseapp.com",
    projectId: "infinite-x-f37a2",
    storageBucket: "infinite-x-f37a2.firebasestorage.app",
    messagingSenderId: "32543278362",
    appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// =====================
// LOGIN CHECK
// =====================

if(
    localStorage.getItem("developerLogged") !== "true"
){

    window.location.href =
        "developer-login.html";

}

// =====================
// LOAD CHARACTERS
// =====================

let characters = [];

async function loadCharacters(){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "characters"
                )
            );

        characters = [];

        snapshot.forEach(
            docSnap => {

                characters.push({

                    id: docSnap.id,

                    ...docSnap.data()

                });

            }
        );

        renderCharacters();

    }

    catch(error){

        console.error(
            "Load characters error:",
            error
        );

        alert(
            "Gagal mengambil data character!"
        );

    }

}

// =====================
// ADD CHARACTER
// =====================

async function addCharacter(){

    const name =
        document.getElementById(
            "charName"
        ).value.trim();

    const role =
        document.getElementById(
            "charRole"
        ).value.trim();

    const desc =
        document.getElementById(
            "charDesc"
        ).value.trim();

    const file =
        document.getElementById(
            "charImage"
        ).files[0];

    // =====================
    // VALIDATION
    // =====================

    if(
        name === "" ||
        role === ""
    ){

        alert(
            "Lengkapi data dulu!"
        );

        return;

    }

    // =====================
    // IMAGE
    // =====================

    if(file){

        const reader =
            new FileReader();

        reader.onload =
            async function(){

                await saveCharacter(
                    name,
                    role,
                    desc,
                    reader.result
                );

            };

        reader.readAsDataURL(
            file
        );

    }

    else{

        await saveCharacter(
            name,
            role,
            desc,
            ""
        );

    }

}

window.addCharacter =
    addCharacter;

// =====================
// SAVE TO FIRESTORE
// =====================

async function saveCharacter(
    name,
    role,
    desc,
    image
){

    try{

        await addDoc(

            collection(
                db,
                "characters"
            ),

            {

                name: name,

                role: role,

                desc: desc,

                image: image

            }

        );

        alert(
            "Character berhasil ditambahkan!"
        );

        // =====================
        // CLEAR FORM
        // =====================

        document.getElementById(
            "charName"
        ).value = "";

        document.getElementById(
            "charRole"
        ).value = "";

        document.getElementById(
            "charDesc"
        ).value = "";

        document.getElementById(
            "charImage"
        ).value = "";

        loadCharacters();

    }

    catch(error){

        console.error(
            "Save character error:",
            error
        );

        alert(
            "Gagal menyimpan character!"
        );

    }

}

// =====================
// DELETE CHARACTER
// =====================

async function deleteCharacter(id){

    if(
        !confirm(
            "Yakin mau hapus character ini?"
        )
    ){

        return;

    }

    try{

        await deleteDoc(

            doc(
                db,
                "characters",
                id
            )

        );

        alert(
            "Character berhasil dihapus!"
        );

        loadCharacters();

    }

    catch(error){

        console.error(
            "Delete character error:",
            error
        );

        alert(
            "Gagal menghapus character!"
        );

    }

}

window.deleteCharacter =
    deleteCharacter;

// =====================
// RENDER
// =====================

function renderCharacters(){

    const container =
        document.getElementById(
            "characterList"
        );

    container.innerHTML = "";

    if(
        characters.length === 0
    ){

        container.innerHTML = `

        <div class="comic-card">

            <h2>
                No Characters Yet
            </h2>

            <p>
                Coming Soon...
            </p>

        </div>

        `;

        return;

    }

    characters.forEach(
        character => {

            container.innerHTML += `

            <div class="character-card">

                <img
                    src="${
                        character.image ||
                        "https://placehold.co/150"
                    }"
                    class="character-image"
                >

                <div>

                    <h2>
                        ${character.name}
                    </h2>

                    <p>
                        Role :
                        ${character.role}
                    </p>

                    <p>
                        ${character.desc || ""}
                    </p>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteCharacter('${character.id}')"
                >
                    Delete
                </button>

            </div>

            `;

        }
    );

}

// =====================
// INIT
// =====================

loadCharacters();

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
