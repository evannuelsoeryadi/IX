
<!DOCTYPE html>
<html>
<head>

<title>Manage Characters - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>
<a href="developer.html">⚙️ Dev Panel</a>

</nav>

<div class="manage-container">

<h1>

Manage Characters

</h1>

<div class="character-form">

<input
type="text"
id="charName"
placeholder="Character Name"
>

<input
type="text"
id="charRole"
placeholder="Character Role"
>

<input
type="text"
id="charImage"
placeholder="Image URL"
>

<textarea
id="charDesc"
placeholder="Character Description"
></textarea>

<button
class="add-btn"
onclick="addCharacter()"
>

+ Add Character

</button>

</div>

<br>

<div id="characterList"></div>

</div>

<script>

if(

localStorage.getItem(
"developerLogged"
) !== "true"

){

window.location.href =
"developer-login.html";

}

let characters =

JSON.parse(
localStorage.getItem(
"infinite_x_characters"
)

) || [];

renderCharacters();

function addCharacter(){

let name =
document.getElementById(
"charName"
).value;

let role =
document.getElementById(
"charRole"
).value;

let image =
document.getElementById(
"charImage"
).value;

let desc =
document.getElementById(
"charDesc"
).value;

if(

name === "" ||
role === ""

){

alert(
"Lengkapi data dulu!"
);

return;

}

characters.push({

name:name,

role:role,

image:image,

desc:desc

});

localStorage.setItem(

"infinite_x_characters",

JSON.stringify(
characters
)

);

renderCharacters();

document.getElementById(
"charName"
).value = "";

document.getElementById(
"charRole"
).value = "";

document.getElementById(
"charImage"
).value = "";

document.getElementById(
"charDesc"
).value = "";

}

function deleteCharacter(index){

characters.splice(
index,
1
);

localStorage.setItem(

"infinite_x_characters",

JSON.stringify(
characters
)

);

renderCharacters();

}

function renderCharacters(){

let html = "";

characters.forEach(
(character,index)=>{

html += `

<div class="character-card">

<img
src="${character.image}"
class="character-image"
>

<div>

<h2>

${character.name}

</h2>

<p>

Role :
${character.role}

</p>

<p>

${character.desc}

</p>

</div>

<button
class="delete-btn"
onclick="deleteCharacter(${index})"
>

Delete

</button>

</div>

`;

});

document.getElementById(
"characterList"
).innerHTML = html;

}

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
