<!DOCTYPE html>

<html>
<head>

```
<title>Manage Characters - Infinite X</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<nav>

    <a href="index.html">Home</a>
    <a href="comic.html">Comic</a>
    <a href="character.html">Character</a>
    <a href="#">About Us</a>
    <a href="profile.html">Profile</a>

    <a href="developer.html">
        ⚙️ Dev Panel
    </a>

</nav>

<div class="manage-container">

    <h1>Manage Characters</h1>

    <div class="character-form">

        <input
            type="text"
            id="charName"
            placeholder="Character Name"
        >

        <input
            type="text"
            id="charPower"
            placeholder="Character Power"
        >

        <textarea
            id="charDesc"
            placeholder="Character Description"
        ></textarea>

        <button
            class="add-btn"
            onclick="addCharacter()"
        >
            + Add Character
        </button>

    </div>

    <div id="characterList"></div>

</div>

<script>

    if(
        localStorage.getItem(
            "developerLogged"
        ) !== "true"
    ){

        window.location.href =
            "developer-login.html";

    }

    let characters =
        JSON.parse(
            localStorage.getItem(
                "characters"
            )
        ) || [];

    renderCharacters();

    function addCharacter(){

        let name =
            document.getElementById(
                "charName"
            ).value;

        let power =
            document.getElementById(
                "charPower"
            ).value;

        let desc =
            document.getElementById(
                "charDesc"
            ).value;

        if(
            name === "" ||
            power === ""
        ){

            alert(
                "Lengkapi data dulu!"
            );

            return;

        }

        characters.push({

            name:name,
            power:power,
            desc:desc

        });

        localStorage.setItem(

            "characters",

            JSON.stringify(
                characters
            )

        );

        renderCharacters();

        document.getElementById(
            "charName"
        ).value = "";

        document.getElementById(
            "charPower"
        ).value = "";

        document.getElementById(
            "charDesc"
        ).value = "";

    }

    function deleteCharacter(index){

        characters.splice(
            index,
            1
        );

        localStorage.setItem(

            "characters",

            JSON.stringify(
                characters
            )

        );

        renderCharacters();

    }

    function renderCharacters(){

        let html = "";

        characters.forEach(
            (character,index)=>{

            html += `

            <div class="character-card">

                <div>

                    <h2>
                        ${character.name}
                    </h2>

                    <p>
                        Power :
                        ${character.power}
                    </p>

                    <p>
                        ${character.desc}
                    </p>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteCharacter(${index})"
                >

                    Delete

                </button>

            </div>

            `;

        });

        document.getElementById(
            "characterList"
        ).innerHTML = html;

    }

</script>
```

</body>
</html>
