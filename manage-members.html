<!DOCTYPE html>

<html>
<head>

<title>Manage Members - Infinite X</title>
    
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">


</head>

<body>


<nav>

    <a href="index.html">Home</a>
    <a href="comic.html">Comic</a>
    <a href="character.html">Character</a>
    <a href="about.html">About Us</a>
    <a href="profile.html">Profile</a>

    <a href="developer.html">
        ⚙️ Dev Panel
    </a>

</nav>

<div class="manage-container">

    <h1>Manage Members</h1>

    <div id="memberList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================

const firebaseConfig = {
    apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
    authDomain: "infinite-x-f37a2.firebaseapp.com",
    projectId: "infinite-x-f37a2",
    storageBucket: "infinite-x-f37a2.firebasestorage.app",
    messagingSenderId: "32543278362",
    appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// =====================
// DEVELOPER CHECK
// =====================

if(
    localStorage.getItem(
        "developerLogged"
    ) !== "true"
){

    window.location.href =
        "developer-login.html";

}

// =====================
// LOAD MEMBERS
// =====================

async function loadMembers(){

    const container =
        document.getElementById(
            "memberList"
        );

    container.innerHTML = "";

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "members"
                )
            );

        if(snapshot.empty){

            container.innerHTML = `

            <div class="comic-card">

                <h2>
                    No Members Yet
                </h2>

            </div>

            `;

            return;

        }

        snapshot.forEach(
            memberSnap => {

                const member =
                    memberSnap.data();

                const id =
                    memberSnap.id;

                container.innerHTML += `

                <div class="member-card">

                    <div>

                        <h2>
                            ${member.username || "Unknown"}
                        </h2>

                        <p>
                            Role : Member
                        </p>

                        <p>
                            Joined :
                            ${member.joined || "-"}
                        </p>

                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteMember('${id}')"
                    >

                        Delete

                    </button>

                </div>

                `;

            }
        );

    }

    catch(error){

        console.error(
            "Load members error:",
            error
        );

        container.innerHTML = `

        <div class="comic-card">

            <h2>
                Failed to load members
            </h2>

            <p>
                Check Firebase connection.
            </p>

        </div>

        `;

    }

}

// =====================
// DELETE MEMBER
// =====================

async function deleteMember(id){

    const confirmDelete =
        confirm(
            "Yakin mau hapus member ini?"
        );

    if(!confirmDelete){

        return;

    }

    try{

        await deleteDoc(

            doc(
                db,
                "members",
                id
            )

        );

        alert(
            "Member berhasil dihapus!"
        );

        loadMembers();

    }

    catch(error){

        console.error(
            "Delete member error:",
            error
        );

        alert(
            "Gagal menghapus member!"
        );

    }

}

// =====================
// GLOBAL
// =====================

window.deleteMember =
    deleteMember;

// =====================
// INIT
// =====================

loadMembers();

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
