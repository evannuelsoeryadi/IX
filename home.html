<!DOCTYPE html>
<html>

<head>

<title>Home - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="home.css">

</head>

<body>

<nav>

<a href="home.html">Home</a>

<a href="comic.html">Comic</a>

<a href="character.html">Character</a>

<a href="about.html">About Us</a>

<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="home-layout">

<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->

<section class="home-dashboard">

<div class="home-panel">

<!-- FEATURED -->

<div class="home-block">

<h1>

🔥 Featured Comic

</h1>

<div
id="featuredComic"
class="comic-container"
>

</div>

</div>

<!-- TRENDING -->

<div class="home-block">

<h1>

📈 Trending

</h1>

<div
id="trendingList"
class="comic-container"
>

</div>

</div>

<!-- NEW RELEASE -->

<div class="home-block">

<h1>

🆕

New Release

</h1>

<div
id="newReleaseList"
class="comic-container"
>

</div>

</div>

<!-- CONTINUE -->

<div class="home-block">

<h1>

📖 Continue Reading

</h1>

<div
id="continueReading"
>

</div>

</div>

<!-- POPULAR -->

<div class="home-block">

<h1>

⭐ Popular

</h1>

<div
id="popularList"
class="comic-container"
>

</div>

</div>

<!-- ANNOUNCEMENT -->

<div class="home-block">

<h1>

📢 Announcement

</h1>

<div
id="announcementBox"
>

<h3>

Welcome to Infinite X

</h3>

<p>

Loading...

</p>

</div>

</div>

<!-- STATS -->

<div class="home-block">

<h1>

📊 Infinite X Stats

</h1>

<div class="stats-grid">

<div class="comic-card">

<h3>

📚 Comics

</h3>

<p id="comicCount">

0

</p>

</div>

<div class="comic-card">

<h3>

👥 Characters

</h3>

<p id="characterCount">

0

</p>

</div>

<div class="comic-card">

<h3>

🌎 Members

</h3>

<p id="memberCount">

0

</p>

</div>

</div>

</div>

</div>

</section>

<!-- ========================= -->
<!-- HERO -->
<!-- ========================= -->

<section class="hero">

<div class="hero-main">

<h1 id="featuredTitle">

Infinite X

</h1>

<p id="featuredDesc">

The beginning of an endless adventure.

</p>

<div class="hero-buttons">

<button
id="readFeatured"
class="btn"
>

Read Now

</button>

<button
id="heroInfo"
class="btn"
>

More Info

</button>

</div>

</div>

</section>

</div>

<script>

// =====================
// LOGIN CHECK
// =====================

if(!localStorage.getItem("user")){

location.href="index.html";

}

// =====================
// DEV PANEL
// =====================

if(localStorage.getItem("developerLogged")==="true"){

document.getElementById("devButton").style.display="block";

}

// =====================
// LOAD DATA
// =====================

const chapters=

JSON.parse(

localStorage.getItem("infinite_x_chapters")

)||[];

const characters=

JSON.parse(

localStorage.getItem("infinite_x_characters")

)||[];

const members=

JSON.parse(

localStorage.getItem("accounts")

)||[];

// =====================
// STATS
// =====================

document.getElementById("comicCount").innerText=

chapters.length;

document.getElementById("characterCount").innerText=

characters.length;

document.getElementById("memberCount").innerText=

members.length;

// =====================
// FEATURED
// =====================

const featuredBox=

document.getElementById("featuredComic");

if(chapters.length>0){

const featured=

chapters[chapters.length-1];

document.getElementById("featuredTitle").innerText=

featured.title;

document.getElementById("featuredDesc").innerText=

featured.desc||"No description.";

featuredBox.innerHTML=

`

<div class="comic-card">

<h2>

${featured.title}

</h2>

<p>

${featured.pages||0} Pages

</p>

</div>

`;

document.getElementById("readFeatured").onclick=function(){

localStorage.setItem(

"selectedChapter",

featured.id||featured.title

);

location.href="reader.html";

};

}else{

featuredBox.innerHTML=

`

<div class="comic-card">

<h2>

Coming Soon

</h2>

<p>

No comic available.

</p>

</div>

`;

}

// =====================
// TRENDING
// =====================

const trendingBox=

document.getElementById("trendingList");

if(chapters.length===0){

trendingBox.innerHTML=

`

<div class="comic-card">

<h2>

Coming Soon

</h2>

</div>

`;

}else{

chapters

.slice(0,5)

.forEach(ch=>{

trendingBox.innerHTML+=

`

<div class="comic-card">

<h2>

${ch.title}

</h2>

<p>

${ch.pages||0} Pages

</p>

</div>

`;

});

}

// =====================
// NEW RELEASE
// =====================

const newRelease=

document.getElementById("newReleaseList");

if(chapters.length===0){

newRelease.innerHTML=

`

<div class="comic-card">

<h2>

Coming Soon

</h2>

</div>

`;

}else{

chapters

.slice(-5)

.reverse()

.forEach(ch=>{

newRelease.innerHTML+=

`

<div class="comic-card">

<h2>

${ch.title}

</h2>

<p>

${ch.pages||0} Pages

</p>

</div>

`;

});

}

// =====================
// POPULAR
// =====================

const popular=

document.getElementById("popularList");

if(chapters.length===0){

popular.innerHTML=

`

<div class="comic-card">

<h2>

Coming Soon

</h2>

</div>

`;

}else{

chapters

.slice(0,5)

.forEach(ch=>{

popular.innerHTML+=

`

<div class="comic-card">

<h2>

${ch.title}

</h2>

<p>

${ch.pages||0} Pages

</p>

</div>

`;

});

}

// =====================
// CONTINUE READING
// =====================

const continueBox=

document.getElementById("continueReading");

const last=

localStorage.getItem("lastReadChapter");

if(last){

continueBox.innerHTML=

`

<div class="comic-card">

<h2>

${last}

</h2>

<button class="btn" onclick="continueReading()">

Continue

</button>

</div>

`;

}else{

continueBox.innerHTML=

`

<div class="comic-card">

<p>

No Reading History

</p>

</div>

`;

}

function continueReading(){

const last=

localStorage.getItem("lastReadChapter");

if(last){

localStorage.setItem(

"selectedChapter",

last

);

location.href="reader.html";

}

}

// =====================
// ANNOUNCEMENT
// =====================

document.getElementById("announcementBox").innerHTML=

`

<h3>

Infinite X Development

</h3>

<p>

Home Dashboard V1 Released.<br>

More features are coming soon.

</p>

`;

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>

</html>
