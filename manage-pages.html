<!DOCTYPE html>
<html>
<head>

<title>Manage Pages - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

  
</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>

<a href="developer.html" id="devButton">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>Manage Chapter</h1>

<input
type="text"
id="chapterTitle"
placeholder="Chapter Title"
/>

<textarea
id="chapterDesc"
placeholder="Chapter Description"
></textarea>

<input
type="number"
id="chapterPrice"
placeholder="Price (0 = Free)"
/>

<input
type="file"
id="chapterCover"
accept="image/*"
/>

<input
type="file"
id="pageInput"
accept="image/*"
style="display:none"
onchange="uploadPage(event)"
/>

<p>
Total Pages :
<span id="pageCount">0</span>
</p>

<button class="add-btn" onclick="addPage()">
+ Add Page
</button>

<div id="pageList">
<!-- Page card akan muncul di sini -->
</div>

<button class="edit-btn" onclick="saveChapter()">
Save Chapter
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    addDoc,
    updateDoc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================

const firebaseConfig = {
    apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
    authDomain: "infinite-x-f37a2.firebaseapp.com",
    projectId: "infinite-x-f37a2",
    storageBucket: "infinite-x-f37a2.firebasestorage.app",
    messagingSenderId: "32543278362",
    appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// =====================
// LOGIN CHECK
// =====================

if(
    localStorage.getItem("developerLogged") !== "true"
){
    window.location.href = "developer-login.html";
}

// =====================
// STATE
// =====================

let editId =
    localStorage.getItem("editingChapter");

let pageImages = [];

let currentCover = "";

// =====================
// LOAD EDIT MODE
// =====================

if(editId){
    loadChapter();
}

// =====================
// LOAD CHAPTER
// =====================

async function loadChapter(){

    try{

        const snap = await getDoc(
            doc(
                db,
                "chapters",
                editId
            )
        );

        if(!snap.exists()){

            alert("Chapter tidak ditemukan!");

            localStorage.removeItem(
                "editingChapter"
            );

            return;
        }

        const chapter = snap.data();

        document.getElementById(
            "chapterTitle"
        ).value =
            chapter.title || "";

        document.getElementById(
            "chapterDesc"
        ).value =
            chapter.desc || "";

        document.getElementById(
            "chapterPrice"
        ).value =
            chapter.price || 0;

        currentCover =
            chapter.cover || "";

        pageImages =
            Array.isArray(chapter.pageImages)
            ? [...chapter.pageImages]
            : [];

        renderPages();

    }

    catch(error){

        console.error(
            "Load chapter error:",
            error
        );

        alert(
            "Gagal mengambil data chapter!"
        );

    }

}

// =====================
// ADD PAGE
// =====================

function addPage(){

    document.getElementById(
        "pageInput"
    ).click();

}

window.addPage = addPage;

// =====================
// UPLOAD PAGE
// =====================

function uploadPage(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = function(){

        pageImages.push(
            reader.result
        );

        renderPages();

        // reset input supaya file yang sama
        // bisa dipilih lagi
        event.target.value = "";

    };

    reader.readAsDataURL(file);

}

window.uploadPage = uploadPage;

// =====================
// RENDER PAGES
// =====================

function renderPages(){

    const container =
        document.getElementById(
            "pageList"
        );

    container.innerHTML = "";

    document.getElementById(
        "pageCount"
    ).innerText =
        pageImages.length;

    pageImages.forEach(
        (img,index)=>{

            container.innerHTML += `

            <div class="page-card">

                <img
                    src="${img}"
                    class="page-preview"
                >

                <div class="page-actions">

                    <button
                        class="delete-btn"
                        onclick="deletePage(${index})"
                    >
                        Delete
                    </button>

                </div>

            </div>

            `;

        }
    );

}

window.renderPages = renderPages;

// =====================
// DELETE PAGE
// =====================

function deletePage(index){

    if(
        !confirm(
            "Hapus halaman ini?"
        )
    ){
        return;
    }

    pageImages.splice(
        index,
        1
    );

    renderPages();

}

window.deletePage = deletePage;

// =====================
// SAVE CHAPTER
// =====================

async function saveChapter(){

    const title =
        document.getElementById(
            "chapterTitle"
        ).value.trim();

    const desc =
        document.getElementById(
            "chapterDesc"
        ).value.trim();

    const price =
        Number(
            document.getElementById(
                "chapterPrice"
            ).value || 0
        );

    const coverFile =
        document.getElementById(
            "chapterCover"
        ).files[0];

    // =====================
    // VALIDATION
    // =====================

    if(
        title === "" ||
        desc === ""
    ){

        alert(
            "Lengkapi data dulu!"
        );

        return;

    }

    // =====================
    // SAVE DATA
    // =====================

    function finishSave(
        coverData
    ){

        return {

            title: title,

            desc: desc,

            price: price,

            cover:
                coverData || "",

            pages:
                pageImages.length,

            pageImages:
                [...pageImages]

        };

    }

    // =====================
    // COVER BARU
    // =====================

    if(coverFile){

        const reader =
            new FileReader();

        reader.onload =
            async function(){

                const data =
                    finishSave(
                        reader.result
                    );

                await saveToFirestore(
                    data
                );

            };

        reader.readAsDataURL(
            coverFile
        );

    }

    // =====================
    // COVER LAMA
    // =====================

    else{

        const data =
            finishSave(
                currentCover
            );

        await saveToFirestore(
            data
        );

    }

}

window.saveChapter =
    saveChapter;

// =====================
// FIRESTORE SAVE
// =====================

async function saveToFirestore(
    data
){

    try{

        // =====================
        // EDIT CHAPTER
        // =====================

        if(editId){

            await updateDoc(

                doc(
                    db,
                    "chapters",
                    editId
                ),

                data

            );

        }

        // =====================
        // ADD CHAPTER
        // =====================

        else{

            await addDoc(

                collection(
                    db,
                    "chapters"
                ),

                data

            );

        }

        // =====================
        // CLEAR EDIT STATE
        // =====================

        localStorage.removeItem(
            "editingChapter"
        );

        alert(
            "Chapter berhasil disimpan!"
        );

        window.location.href =
            "manage-comics.html";

    }

    catch(error){

        console.error(
            "Firestore save error:",
            error
        );

        alert(
            "Gagal menyimpan chapter!"
        );

    }

}

</script>

  <div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
