</nav>

<div class="manage-container">

<h1>

Manage Chapter

</h1>

<input
type="text"
id="chapterTitle"
placeholder="Chapter Title"
>

<textarea
id="chapterDesc"
placeholder="Chapter Description"
></textarea>

<input
type="number"
id="chapterPrice"
placeholder="Price (0 = Free)"
>

<input
type="file"
id="chapterCover"
accept="image/*"
>

<p>

Total Pages :
<span id="pageCount">

0

</span>

</p>

<button
class="add-btn"
onclick="addPage()"
>

+ Add Page

</button>

<div id="pageList">

</div>

<button
class="edit-btn"
onclick="saveChapter()"
>

Save Chapter

</button>

<div id="pageList">

<!-- Page card akan muncul di sini -->

</div>

</div>

<script>

if(

localStorage.getItem(
"developerLogged"
) !== "true"

){

window.location.href =
"developer-login.html";

}

let pageImages = [];

function addPage(){

    document
    .getElementById(
        "pageInput"
    )
    .click();

}

function uploadPage(event){

    let file =
        event.target.files[0];

    if(!file){

        return;

    }

    let reader =
        new FileReader();

    reader.onload = function(){

        pageImages.push(
            reader.result
        );

        renderPages();

    };

    reader.readAsDataURL(
        file
    );

}

function renderPages(){

    let container =
        document.getElementById(
            "pageList"
        );

    container.innerHTML = "";

    document.getElementById(
        "pageCount"
    ).innerText =
        pageImages.length;

    pageImages.forEach(
        (img,index)=>{

            container.innerHTML += `

            <div class="page-card">

                <img
                src="${img}"
                class="page-preview"
                >

                <div class="page-actions">

                    <button
                    class="delete-btn"
                    onclick="deletePage(${index})"
                    >

                    Delete

                    </button>

                </div>

            </div>

            `;

        });

}

function deletePage(index){

    pageImages.splice(
        index,
        1
    );

    renderPages();

}

</script>

</body>
</html>
