<!DOCTYPE html>
<html>
<head>

<title>Manage Pages - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1>

Manage Chapter

</h1>

<input
type="text"
id="chapterTitle"
placeholder="Chapter Title"
>

<textarea
id="chapterDesc"
placeholder="Chapter Description"
></textarea>

<input
type="number"
id="chapterPrice"
placeholder="Price (0 = Free)"
>

<input
type="file"
id="chapterCover"
accept="image/*"
>

<input
type="file"
id="pageInput"
accept="image/*"
style="display:none"
onchange="uploadPage(event)"
>

<p>

Total Pages :
<span id="pageCount">

0

</span>

</p>

<button
class="add-btn"
onclick="addPage()"
>

+ Add Page

</button>

<div id="pageList">

<!-- Page card akan muncul di sini -->

</div>

<button
class="edit-btn"
onclick="saveChapter()"
>

Save Chapter

</button>

</div>

<script>

if(

localStorage.getItem(
"developerLogged"
) !== "true"

){

window.location.href =
"developer-login.html";

}

let pageImages = [];

function addPage(){

document
.getElementById(
"pageInput"
)
.click();

}

function uploadPage(event){

let file =
event.target.files[0];

if(
!file
){

return;

}

let reader =
new FileReader();

reader.onload =
function(){

pageImages.push(
reader.result
);

renderPages();

};

reader.readAsDataURL(
file
);

}

function renderPages(){

let container =

document.getElementById(
"pageList"
);

container.innerHTML = "";

document.getElementById(
"pageCount"
).innerText =
pageImages.length;

pageImages.forEach(

(img,index)=>{

container.innerHTML += `

<div class="page-card">

<img
src="${img}"
class="page-preview"
>

<div class="page-actions">

<button
class="delete-btn"
onclick="deletePage(${index})"
>

Delete

</button>

</div>

</div>

`;

}

);

}

function deletePage(index){

pageImages.splice(
index,
1
);

renderPages();

}


function saveChapter(){

let title =
document.getElementById(
"chapterTitle"
).value;

let desc =
document.getElementById(
"chapterDesc"
).value;

let price =
document.getElementById(
"chapterPrice"
).value;

let coverFile =
document.getElementById(
"chapterCover"
).files[0];

if(

title == "" ||
desc == ""

){

alert(
"Lengkapi data dulu!"
);

return;

}

let chapters =

JSON.parse(

localStorage.getItem(
"infinite_x_chapters"
)

) || [];

function finishSave(coverData){

chapters.push({

title:title,

desc:desc,

price:Number(price),

cover:coverData,

pages:pageImages.length,

pageImages:pageImages

});

localStorage.setItem(

"infinite_x_chapters",

JSON.stringify(
chapters
)

);

alert(
"Chapter berhasil disimpan!"
);

window.location.href =
"manage-comics.html";

}

if(

coverFile

){

let reader =
new FileReader();

reader.onload =
function(){

finishSave(
reader.result
);

};

reader.readAsDataURL(
coverFile
);

}

else{

finishSave("");

}

}


</script>

</body>
</html>
