<!DOCTYPE html>
<html>
<head>
    <title>IX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <a href="#">⌂</a>
        <a href="#">Comic</a>
        <a href="#">Character</a>
        <a href="#">About Us</a>

        <!-- PROFILE (CEK LOGIN) -->
        <a href="#" onclick="goProfile()">Profile</a>
    </nav>

    <div class="hero">

        <h1>Infinite X</h1>
        <p>A New World Awaits</p>

        <!-- START READING (CEK LOGIN) -->
        <a href="#" class="btn" id="startBtn">
            Start Reading
        </a>

    </div>

    <script>
        function isLoggedIn() {
            return localStorage.getItem("user") !== null;
        }

        // START READING
        document.getElementById("startBtn").addEventListener("click", function(e){
            e.preventDefault();

            if(!isLoggedIn()){
                window.location.href = "login.html";
            } else {
                window.location.href = "comic.html";
            }
        });

        // PROFILE
        function goProfile(){
            if(!isLoggedIn()){
                window.location.href = "login.html";
            } else {
                window.location.href = "profile.html";
            }
        }
    </script>

</body>
</html>
