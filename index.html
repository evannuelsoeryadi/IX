<nav>

<div class="hero">

    <h1>Infinite X</h1>

    <p>
        A New World Awaits
    </p>

    <a
        href="#"
        class="btn"
        id="startBtn"
    >
        Start Reading
    </a>

</div>

<script>

    function isLoggedIn(){

        return (
            localStorage.getItem(
                "user"
            ) !== null
        );

    }

    document
    .getElementById(
        "startBtn"
    )
    .addEventListener(
        "click",
        function(e){

            e.preventDefault();

            if(
                !isLoggedIn()
            ){

                window.location.href =
                    "whoareyou.html";

            }else{

                window.location.href =
                    "comic.html";

            }

        }
    );

    function goProfile(){

        if(
            !isLoggedIn()
        ){

            window.location.href =
                "whoareyou.html";

        }else{

            window.location.href =
                "profile.html";

        }

    }

    function goComic(){

        if(
            !isLoggedIn()
        ){

            window.location.href =
                "whoareyou.html";

        }else{

            window.location.href =
                "comic.html";

        }

    }

    if(

        localStorage.getItem(
            "developerLogged"
        ) === "true"

    ){

        document
        .getElementById(
            "devButton"
        )
        .style.display =
            "block";

    }

</script>
