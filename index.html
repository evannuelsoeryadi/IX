<!DOCTYPE html>
<html>

<head>

<title>IX</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="#" onclick="goComic()">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="#" onclick="goProfile()">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<!-- ========================= -->
<!-- HERO -->
<!-- ========================= -->

<section class="hero">

<div class="hero-main">

<h1>

Infinite X

</h1>

<p>

Read • Create • Explore

</p>

<div class="hero-buttons">

<a

href="#"

class="btn"

id="startBtn"

>

Start Reading

</a>

<a

href="character.html"

class="btn"

>

Characters

</a>

</div>

</div>

</section>

<!-- ========================= -->
<!-- HOME DASHBOARD -->
<!-- ========================= -->

<section
class="home-dashboard"
id="loggedContent"
style="display:none;"
>

<div class="home-panel">

<!-- Latest -->

<div class="home-block">

<h2>

🔥 Latest Updates

</h2>

<div

id="latestUpdates"

class="comic-container"

>

</div>

</div>

<!-- Characters -->

<div class="home-block">

<h2>

⭐ Popular Characters

</h2>

<div

id="popularCharacters"

class="comic-container"

>

</div>

</div>

<!-- Stats -->

<div class="home-block">

<h2>

📊 Infinite X Stats

</h2>

<div class="stats-grid">

<div class="comic-card">

<h3>

📚 Comics

</h3>

<p id="comicCount">

0

</p>

</div>

<div class="comic-card">

<h3>

👥 Characters

</h3>

<p id="characterCount">

0

</p>

</div>

<div class="comic-card">

<h3>

🌎 Members

</h3>

<p id="memberCount">

0

</p>

</div>

</div>

</div>

<!-- Footer -->

<div class="home-footer">

<p>

Infinite X © 2026

</p>

<p>

Made by Evan and Team

</p>

</div>

</div>

</section>

<script>

function isLoggedIn(){

return localStorage.getItem(
"user"
)!==null;

}

// =====================
// START BUTTON
// =====================

document
.getElementById(
"startBtn"
)
.onclick=function(e){

e.preventDefault();

if(!isLoggedIn()){

window.location.href=
"whoareyou.html";

}

else{

window.location.href=
"comic.html";

}

};

// =====================
// PROFILE
// =====================

function goProfile(){

if(!isLoggedIn()){

window.location.href=
"whoareyou.html";

}

else{

window.location.href=
"profile.html";

}

}

// =====================
// COMIC
// =====================

function goComic(){

if(!isLoggedIn()){

window.location.href=
"whoareyou.html";

}

else{

window.location.href=
"comic.html";

}

}

// =====================
// DEV PANEL
// =====================

if(

localStorage.getItem(
"developerLogged"
)==="true"

){

document
.getElementById(
"devButton"
)
.style.display=
"block";

}

// =====================
// SHOW DASHBOARD
// =====================

if(isLoggedIn()){

document
.getElementById(
"loggedContent"
)
.style.display=
"block";

}

// =====================
// LOAD DATA
// =====================

const chapters=

JSON.parse(

localStorage.getItem(
"chapters"

)

)||[];

const characters=

JSON.parse(

localStorage.getItem(
"infinite_x_characters"

)

)||[];

const members=

JSON.parse(

localStorage.getItem(
"accounts"

)

)||[];

// =====================
// STATS
// =====================

comicCount.innerText=
chapters.length;

characterCount.innerText=
characters.length;

memberCount.innerText=
members.length;

// =====================
// LATEST UPDATES
// =====================

const latestBox=

document.getElementById(
"latestUpdates"
);

if(chapters.length===0){

latestBox.innerHTML=

`

<div class="comic-card">

<h3>

Coming Soon

</h3>

<p>

No comic available yet.

</p>

</div>

`;

}

else{

chapters
.slice(-3)
.reverse()
.forEach(ch=>{

latestBox.innerHTML+=

`

<div class="comic-card">

<h3>

${ch.title}

</h3>

<p>

${ch.pages||0} Pages

</p>

</div>

`;

});

}

// =====================
// POPULAR CHARACTERS
// =====================

const charBox=

document.getElementById(
"popularCharacters"
);

if(characters.length===0){

charBox.innerHTML=

`

<div class="comic-card">

<h3>

Coming Soon

</h3>

<p>

No character available yet.

</p>

</div>

`;

}

else{

characters
.slice(-3)
.reverse()
.forEach(ch=>{

charBox.innerHTML+=

`

<div class="comic-card">

<img

src="${ch.image}"

class="character-image"

>

<h3>

${ch.name}

</h3>

<p>

${ch.role||""}

</p>

</div>

`;

});

}

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>

</html>
