<!DOCTYPE html>
<html>
<head>

<title>Developer Dashboard - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="home.html">
Home
</a>

<a href="comic.html">
Comic
</a>

<a href="character.html">
Character
</a>

<a href="about.html">
About Us
</a>

<a href="profile.html">
Profile
</a>

<a href="developer.html">
⚙️ Dev Panel
</a>

</nav>

<div class="dashboard">

<h1>

Developer Dashboard

</h1>

<div class="dev-card">

<h2 id="devName"></h2>

<p>

Role :
<span id="devRole"></span>

</p>

<p>

ID :
<span id="devID"></span>

</p>

</div>

<div class="dashboard-buttons">

<button
onclick="window.location.href='manage-comics.html'"
>

Manage Comics

</button>

<button
onclick="window.location.href='manage-characters.html'"
>

Manage Characters

</button>

<button
onclick="window.location.href='manage-members.html'"
>

Manage Members

</button>

<button
onclick="window.location.href='theme.html'"
>

Wallpaper Theme

</button>

<button
class="logout-btn"
onclick="logoutDeveloper()"
>

Logout

</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


// =====================
// FIREBASE
// =====================

const firebaseConfig = {

    apiKey:
    "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",

    authDomain:
    "infinite-x-f37a2.firebaseapp.com",

    projectId:
    "infinite-x-f37a2",

    storageBucket:
    "infinite-x-f37a2.firebasestorage.app",

    messagingSenderId:
    "32543278362",

    appId:
    "1:32543278362:web:54e231f17c92596888d8a3"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


// =====================
// DEV LOGIN CHECK
// =====================

const developerID =
    sessionStorage.getItem(
        "developerID"
    );


if(

    sessionStorage.getItem(
        "developerLogged"
    ) !== "true"

    ||

    !developerID

){

    window.location.href =
        "developer-login.html";

}


// =====================
// LOAD DEVELOPER
// =====================

async function loadDeveloper(){

    try{

        const devRef =
            doc(
                db,
                "developers",
                developerID
            );


        const devSnap =
            await getDoc(devRef);


        if(!devSnap.exists()){

            alert(
                "Developer account tidak ditemukan!"
            );

            logoutDeveloper();

            return;

        }


        const dev =
            devSnap.data();


        document.getElementById(
            "devName"
        ).innerText =

            dev.name ||
            "Developer";


        document.getElementById(
            "devRole"
        ).innerText =

            dev.role ||
            "Developer";


        document.getElementById(
            "devID"
        ).innerText =

            developerID;

    }

    catch(error){

        console.error(
            "Developer Firebase Error:",
            error
        );

        alert(
            "Gagal mengambil data Developer."
        );

    }

}


// =====================
// LOGOUT
// =====================

function logoutDeveloper(){

    sessionStorage.removeItem(
        "developerLogged"
    );

    sessionStorage.removeItem(
        "developerID"
    );

    sessionStorage.removeItem(
        "developerName"
    );

    sessionStorage.removeItem(
        "developerRole"
    );

    localStorage.removeItem(
        "user"
    );


    window.location.href =
        "index.html";

}


window.logoutDeveloper =
    logoutDeveloper;


// =====================
// INIT
// =====================

loadDeveloper();

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
