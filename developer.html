<!DOCTYPE html>
<html>
<head>
    <title>Developer Dashboard - Infinite X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <a href="index.html">Home</a>

        <a href="comic.html">
            Comic
        </a>

        <a href="character.html">
            Character
        </a>

        <a href="#">
            About Us
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="developer.html">
            ⚙️ Dev Panel
        </a>

    </nav>

    <div class="dashboard">

        <h1>Developer Dashboard</h1>

        <div class="dev-card">

            <h2 id="devName"></h2>

            <p>
                Role:
                <span id="devRole"></span>
            </p>

            <p>
                ID:
                <span id="devID"></span>
            </p>

        </div>

        <div class="dashboard-buttons">

            <button onclick="window.location.href='manage-comics.html'">
                Manage Comics
            </button>

            <button onclick="window.location.href='manage-characters.html'">
                Manage Characters
            </button>

            <button onclick="window.location.href='manage-members.html'">
                Manage Members
            </button>

            <button
                class="logout-btn"
                onclick="logoutDeveloper()"
            >
                Logout
            </button>

        </div>

    </div>

    <script>

        if(
            localStorage.getItem(
                "developerLogged"
            ) !== "true"
        ){

            window.location.href =
                "developer-login.html";

        }

        document.getElementById(
            "devName"
        ).innerText =
            localStorage.getItem(
                "developerName"
            );

        document.getElementById(
            "devRole"
        ).innerText =
            localStorage.getItem(
                "developerRole"
            );

        document.getElementById(
            "devID"
        ).innerText =
            localStorage.getItem(
                "developerID"
            );

function logoutDeveloper(){

    localStorage.removeItem(
        "developerLogged"
    );

    localStorage.removeItem(
        "developerName"
    );

    localStorage.removeItem(
        "developerRole"
    );

    localStorage.removeItem(
        "developerID"
    );

    localStorage.removeItem(
        "user"
    );

    window.location.href =
        "index.html";

}

    </script>

</body>
</html>
