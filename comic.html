<!DOCTYPE html>
<html>
<head>

<title>Our Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="comic-page">

<h1 class="comic-title">

Our Comics

</h1>

<div
class="comic-container"
id="comicContainer"
>

</div>

</div>

<script>

let chapters =

JSON.parse(

localStorage.getItem(
"infinite_x_chapters"
)

) || [];

let container =

document.getElementById(
"comicContainer"
);

container.innerHTML = "";

if(
chapters.length == 0
){

container.innerHTML =

"<h2 style='color:white'>Belum ada chapter.</h2>";

}

chapters.forEach(
(chapter,index)=>{

container.innerHTML += `

<div class="comic-card">

<div class="card-inner">

<div class="card-front">

${
chapter.cover

?

'<img src="' +
chapter.cover +
'" class="cover-img">'

:

'No Cover'

}

</div>

<div class="card-back">

${chapter.desc}

</div>

</div>

<p class="chapter-price">

Price :
${chapter.price == 0 ? "Free" : chapter.price}

</p>

<button
class="chapter-btn"
onclick="openChapter(${index})"
>

${chapter.title}

</button>

</div>

`;

});

function openChapter(index){

localStorage.setItem(

"currentChapter",

index

);

window.location.href =
"reader.html";

}

let user =
localStorage.getItem(
"user"
);

let isDeveloper =
localStorage.getItem(
"developerLogged"
);

if(
!user &&
isDeveloper !== "true"
){

window.location.href =
"whoareyou.html";

}

if(
isDeveloper === "true"
){

document.getElementById(
"devButton"
).style.display =
"inline-block";

}

</script>

</body>
</html>
