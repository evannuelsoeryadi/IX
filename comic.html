<link rel="stylesheet" href="theme.css">

</head>

<body>

    
<nav>

⚙️ Dev Panel

</nav>

<div class="manage-container">

<h1>

Infinite X Comics

</h1>

<!-- ===================== -->
<!-- TOOLBAR -->

<div class="comic-toolbar">

<input

type="text"

<!-- ===================== -->
<!-- CONTINUE READING -->
<!-- ===================== -->

<div
id="continueBox"
class="continue-card"
style="display:none;">

<div class="continue-layout">

<img
id="continueCover"
class="continue-cover"
src="https://placehold.co/120x170"
>

<div class="continue-info">

<div class="continue-top">

<h2>

📖 Continue Reading

</h2>

<span
id="continueGenre"
class="continue-genre">

Action • Fantasy

</span>

</div>

<h3 id="continueTitle">

</h3>

<div class="continue-progress">

<div
id="continueBar"
class="continue-bar">

</div>

</div>

<p id="continuePercent">

0%

</p>

<p id="continuePages">

</p>

Last Read :

class="add-btn"

</div>

<!-- ===================== -->
<!-- CHAPTER TITLE -->
<!-- ===================== -->

<h2 class="comic-section-title">

Latest Chapters

</h2>

<div id="chapterList">

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    getDoc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


// =====================
// FIREBASE
// =====================

const firebaseConfig = {

    apiKey:
    "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",

    authDomain:
    "infinite-x-f37a2.firebaseapp.com",

    projectId:
    "infinite-x-f37a2",

    storageBucket:
    "infinite-x-f37a2.firebasestorage.app",

    messagingSenderId:
    "32543278362",

    appId:
    "1:32543278362:web:54e231f17c92596888d8a3"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


// =====================
// CURRENT USER
// =====================

const uid =
    sessionStorage.getItem(
        "firebaseUID"
    );


// =====================
// CHAPTER LIST
// =====================

let chapters = [];


// =====================
// CONTINUE READING
// =====================

async function checkContinue(){

    if(!uid)
        return;


    const userRef =
        doc(
            db,
            "users",
            uid
        );


    const userSnap =
        await getDoc(
            userRef
        );


    if(!userSnap.exists())
        return;


    const userData =
        userSnap.data();


    const reading =
        userData.readingProgress;


    if(!reading)
        return;


    const last =
        reading.chapterId;


    if(!last)
        return;


    const chapter =
        chapters.find(
            c => c.id === last
        );


    if(!chapter)
        return;


    document.getElementById(
        "continueBox"
    ).style.display =
        "block";


    document.getElementById(
        "continueCover"
    ).src =
        chapter.cover ||
        "https://placehold.co/120x170";


    document.getElementById(
        "continueTitle"
    ).innerText =
        chapter.title;


    document.getElementById(
        "continueGenre"
    ).innerText =
        chapter.genre ||
        "Unknown";


    const lastPage =
        Number(
            reading.page || 0
        );


    const totalPages =
        Number(
            chapter.pages || 0
        );


    let percent = 0;


    if(totalPages > 0){

        percent =
            Math.round(
                (
                    lastPage /
                    totalPages
                ) * 100
            );

    }


    document.getElementById(
        "continuePages"
    ).innerText =

        "Page " +
        lastPage +
        " / " +
        totalPages;


    document.getElementById(
        "continuePercent"
    ).innerText =

        percent +
        "%";


    document.getElementById(
        "continueBar"
    ).style.width =

        percent +
        "%";


    const time =
        reading.lastReadTime;


    if(time){

        const diff =
            Date.now() -
            Number(time);


        const hours =
            Math.floor(
                diff / 3600000
            );


        if(hours < 1){

            document.getElementById(
                "continueTime"
            ).innerText =
                "Last Read : Just now";

        }

        else if(hours < 24){

            document.getElementById(
                "continueTime"
            ).innerText =

                "Last Read : " +
                hours +
                " hour(s) ago";

        }

        else{

            const day =
                Math.floor(
                    hours / 24
                );


            document.getElementById(
                "continueTime"
            ).innerText =

                "Last Read : " +
                day +
                " day(s) ago";

        }

    }

}


// =====================
// LOAD CHAPTERS
// =====================

async function loadChapters(){

    const container =
        document.getElementById(
            "chapterList"
        );


    container.innerHTML = "";


    chapters = [];


    const snapshot =
        await getDocs(
            collection(
                db,
                "chapters"
            )
        );


    snapshot.forEach(
        docSnap => {

            chapters.push({

                id:
                    docSnap.id,

                ...docSnap.data()

            });

        }
    );


    renderChapters();

    await checkContinue();

}


// =====================
// RENDER
// =====================

function renderChapters(){

    const container =
        document.getElementById(
            "chapterList"
        );


    container.innerHTML = "";


    chapters.forEach(
        ch => {

            container.innerHTML += `

                <div
                    class="chapter-card"
                >

                    <img
                        src="${
                            ch.cover ||
                            "https://placehold.co/120x170"
                        }"
                    >

                    <div
                        class="chapter-info"
                    >

                        <h3>
                            ${ch.title}
                        </h3>

                        <p>
                            ${ch.desc || ""}
                        </p>

                        <p>
                            Pages :
                            ${ch.pages || 0}
                        </p>

                    </div>

                    <button
                        class="edit-btn"
                        onclick="openChapter('${ch.id}')"
                    >

                        Read

                    </button>

                </div>

            `;

        }
    );

}


// =====================
// OPEN CHAPTER
// =====================

async function openChapter(id){

    if(uid){

        const userRef =
            doc(
                db,
                "users",
                uid
            );


        const current =
            await getDoc(
                userRef
            );


        const oldData =
            current.exists()
            ? current.data()
            : {};


        await setDoc(
            userRef,
            {

                selectedChapter:
                    id,

                readingProgress:
                {

                    chapterId:
                        id,

                    page:
                        0,

                    lastReadTime:
                        Date.now()

                }

            },
            {
                merge: true
            }
        );

    }


    window.location.href =
        "reader.html";

}


window.openChapter =
    openChapter;


// =====================
// CONTINUE READING
// =====================

async function continueReading(){

    if(!uid)
        return;


    const userSnap =
        await getDoc(

            doc(
                db,
                "users",
                uid
            )

        );


    if(
        !userSnap.exists()
    )
        return;


    const data =
        userSnap.data();


    const reading =
        data.readingProgress;


    if(
        !reading ||
        !reading.chapterId
    )
        return;


    window.location.href =
        "reader.html";

}


window.continueReading =
    continueReading;


// =====================
// DEV MODE
// =====================

if(

    sessionStorage.getItem(
        "developerLogged"
    ) === "true"

){

    document.getElementById(
        "devButton"
    ).style.display =
        "block";

}


// =====================
// SEARCH
// =====================

document
.getElementById(
    "searchComic"
)
.addEventListener(
    "input",
    e => {

        const keyword =
            e.target.value
            .toLowerCase();


        document
        .querySelectorAll(
            ".chapter-card"
        )
        .forEach(
            card => {

                card.style.display =

                    card.innerText
                    .toLowerCase()
                    .includes(keyword)

                    ? "flex"

                    : "none";

            }
        );

    }
);


// =====================
// INIT
// =====================

loadChapters();

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
