<!DOCTYPE html>
<html>
<head>

<title>Infinite X - Comics</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="profile.html">Profile</a>

<a href="developer.html" id="devButton" style="display:none;">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>Infinite X Comics</h1>

<!-- 🔥 CONTINUE READING -->
<div id="continueBox" style="display:none;">
    <h3>Continue Reading</h3>
    <button class="add-btn" onclick="continueReading()">
        Resume Last Chapter
    </button>
</div>

<h2>Latest Chapters</h2>

<div id="chapterList"></div>

</div>

<script>

let chapters = JSON.parse(localStorage.getItem("infinite_x_chapters")) || [];

// =====================
// CONTINUE READING CHECK
// =====================
function checkContinue(){

    let last = localStorage.getItem("lastReadChapter");

    if(last !== null && chapters[last]){
        document.getElementById("continueBox").style.display = "block";
    }
}

// =====================
// CONTINUE FUNCTION
// =====================
function continueReading(){

    let last = localStorage.getItem("lastReadChapter");

    if(last !== null){
        localStorage.setItem("currentChapter", last);
        window.location.href = "reader.html";
    }
}

// =====================
// RENDER CHAPTER LIST
// =====================
function renderChapters(){

    let container = document.getElementById("chapterList");
    container.innerHTML = "";

    chapters.forEach((ch, index)=>{

        container.innerHTML += `
        <div class="chapter-card">

            <img src="${ch.cover || "https://placehold.co/120x170"}">

            <div class="chapter-info">

                <h3>${ch.title}</h3>
                <p>${ch.desc}</p>
                <p>Pages: ${ch.pages}</p>

            </div>

            <button class="edit-btn" onclick="openChapter(${index})">
                Read
            </button>

        </div>
        `;
    });
}

// =====================
// OPEN CHAPTER
// =====================
function openChapter(index){

    localStorage.setItem("currentChapter", index);

    // 🔥 save last read
    localStorage.setItem("lastReadChapter", index);

    window.location.href = "reader.html";
}

// =====================
// DEV MODE
// =====================
if(localStorage.getItem("developerLogged") === "true"){
    document.getElementById("devButton").style.display = "block";
}

// =====================
// INIT
// =====================
renderChapters();
checkContinue();

</script>

</body>
</html>
