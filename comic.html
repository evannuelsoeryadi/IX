<!DOCTYPE html>
<html>
<head>

<title>Infinite X - Comics</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

    
<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About us</a>
<a href="profile.html">Profile</a>

<a href="developer.html" id="devButton" style="display:none;">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>

Infinite X Comics

</h1>

<!-- ===================== -->
<!-- TOOLBAR -->
<!-- ===================== -->

<div class="comic-toolbar">

<input

type="text"

id="searchComic"

placeholder="🔍 Search comics..."

>

<select id="genreFilter">

<option value="all">

All Genres

</option>

<option value="Action">

Action

</option>

<option value="Fantasy">

Fantasy

</option>

<option value="Sci-Fi">

Sci-Fi

</option>

<option value="Comedy">

Comedy

</option>

</select>

<select id="sortComic">

<option value="new">

Newest

</option>

<option value="old">

Oldest

</option>

<option value="az">

A - Z

</option>

<option value="za">

Z - A

</option>

</select>

</div>

<!-- ===================== -->
<!-- CONTINUE READING -->
<!-- ===================== -->

<div
id="continueBox"
class="continue-card"
style="display:none;">

<div class="continue-layout">

<img
id="continueCover"
class="continue-cover"
src="https://placehold.co/120x170"
>

<div class="continue-info">

<h2>

📖 Continue Reading

</h2>

<h3 id="continueTitle">

Loading...

</h3>

<p id="continuePages">

0 Pages

</p>

<button

class="add-btn"

onclick="continueReading()"

>

Resume Reading

</button>

</div>

</div>

</div>

<!-- ===================== -->
<!-- CHAPTER TITLE -->
<!-- ===================== -->

<h2 class="comic-section-title">

Latest Chapters

</h2>

<div id="chapterList">

</div>

<script type="module">
import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================
const firebaseConfig = {
  apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
  authDomain: "infinite-x-f37a2.firebaseapp.com",
  projectId: "infinite-x-f37a2",
  storageBucket: "infinite-x-f37a2.firebasestorage.app",
  messagingSenderId: "32543278362",
  appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// =====================
// CHAPTER LIST
// =====================
let chapters = [];

// =====================
// CONTINUE READING CHECK
// =====================
function checkContinue(){

let last =
localStorage.getItem(
"lastReadChapter"
);

if(!last) return;

let chapter =
chapters.find(c=>c.id===last);

if(!chapter) return;

document.getElementById(
"continueBox"
).style.display =
"block";

document.getElementById(
"continueTitle"
).innerText =
chapter.title;

document.getElementById(
"continuePages"
).innerText =
chapter.pages + " Pages";

document.getElementById(
"continueCover"
).src =
chapter.cover ||
"https://placehold.co/120x170";

}
// =====================
// LOAD CHAPTERS
// =====================
async function loadChapters(){

    let container =
    document.getElementById(
        "chapterList"
    );

    container.innerHTML = "";

    chapters = [];

    let snapshot =
    await getDocs(
        collection(
            db,
            "chapters"
        )
    );

    snapshot.forEach(docSnap=>{

        chapters.push({

            id: docSnap.id,

            ...docSnap.data()

        });

    });

    renderChapters();
    
    checkContinue();

}


// =====================
// RENDER
// =====================
function renderChapters(){

    let container =
    document.getElementById(
        "chapterList"
    );

    container.innerHTML = "";

    chapters.forEach((ch)=>{

        container.innerHTML += `

        <div class="chapter-card">

            <img
            src="${
                ch.cover ||
                "https://placehold.co/120x170"
            }">

            <div class="chapter-info">

                <h3>

                ${ch.title}

                </h3>

                <p>

                ${ch.desc}

                </p>

                <p>

                Pages :
                ${ch.pages}

                </p>

            </div>

            <button
            class="edit-btn"
            onclick="openChapter('${ch.id}')"
            >

            Read

            </button>

        </div>

        `;

    });

}

// =====================
// OPEN CHAPTER
// =====================
function openChapter(id){

    localStorage.setItem(

        "selectedChapter",

        id

    );

    localStorage.setItem(

        "lastReadChapter",

        id

    );

    window.location.href =
    "reader.html";

}

window.openChapter = openChapter;

// =====================
// DEV MODE
// =====================
if(

localStorage.getItem(
"developerLogged"
) === "true"

){

document.getElementById(
"devButton"
).style.display =
"block";

}

// =====================
// INIT
// =====================
loadChapters();

document.getElementById("searchComic")
.addEventListener("input",e=>{

let keyword=e.target.value.toLowerCase();

document.querySelectorAll(".chapter-card")

.forEach(card=>{

card.style.display=

card.innerText.toLowerCase().includes(keyword)

?

"flex"

:

"none";

});

});

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
