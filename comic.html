<!DOCTYPE html>
<html>
<head>

<title>Infinite X - Comics</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

    
<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="profile.html">Profile</a>

<a href="developer.html" id="devButton" style="display:none;">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1>Infinite X Comics</h1>

<!-- 🔥 CONTINUE READING -->
<div id="continueBox" style="display:none;">
    <h3>Continue Reading</h3>
    <button class="add-btn" onclick="continueReading()">
        Resume Last Chapter
    </button>
</div>

<h2>Latest Chapters</h2>

<div id="chapterList"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================
const firebaseConfig = {
  apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
  authDomain: "infinite-x-f37a2.firebaseapp.com",
  projectId: "infinite-x-f37a2",
  storageBucket: "infinite-x-f37a2.firebasestorage.app",
  messagingSenderId: "32543278362",
  appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

// =====================
// CHAPTER LIST
// =====================
let chapters = [];

// =====================
// CONTINUE READING CHECK
// =====================
function checkContinue(){

    let last = localStorage.getItem(
        "lastReadChapter"
    );

    if(last){

        document.getElementById(
            "continueBox"
        ).style.display =
        "block";

    }

}

window.continueReading = continueReading;

// =====================
// CONTINUE FUNCTION
// =====================
function continueReading(){

    let last =
    localStorage.getItem(
        "lastReadChapter"
    );

    if(last){

        localStorage.setItem(
            "selectedChapter",
            last
        );

        window.location.href =
        "reader.html";

    }

}

// =====================
// LOAD CHAPTERS
// =====================
async function loadChapters(){

    let container =
    document.getElementById(
        "chapterList"
    );

    container.innerHTML = "";

    chapters = [];

    let snapshot =
    await getDocs(
        collection(
            db,
            "chapters"
        )
    );

    snapshot.forEach(docSnap=>{

        chapters.push({

            id: docSnap.id,

            ...docSnap.data()

        });

    });

    renderChapters();

}

// =====================
// RENDER
// =====================
function renderChapters(){

    let container =
    document.getElementById(
        "chapterList"
    );

    container.innerHTML = "";

    chapters.forEach((ch)=>{

        container.innerHTML += `

        <div class="chapter-card">

            <img
            src="${
                ch.cover ||
                "https://placehold.co/120x170"
            }">

            <div class="chapter-info">

                <h3>

                ${ch.title}

                </h3>

                <p>

                ${ch.desc}

                </p>

                <p>

                Pages :
                ${ch.pages}

                </p>

            </div>

            <button
            class="edit-btn"
            onclick="openChapter('${ch.id}')"
            >

            Read

            </button>

        </div>

        `;

    });

}

// =====================
// OPEN CHAPTER
// =====================
function openChapter(id){

    localStorage.setItem(

        "selectedChapter",

        id

    );

    localStorage.setItem(

        "lastReadChapter",

        id

    );

    window.location.href =
    "reader.html";

}

window.openChapter = openChapter;

// =====================
// DEV MODE
// =====================
if(

localStorage.getItem(
"developerLogged"
) === "true"

){

document.getElementById(
"devButton"
).style.display =
"block";

}

// =====================
// INIT
// =====================
loadChapters();

checkContinue();

</script>

<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
