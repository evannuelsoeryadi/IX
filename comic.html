<!DOCTYPE html>
<html>
<head>

<title>Our Comics - Infinite X</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="comic-page">

<h1 class="comic-title">

Our Comics

</h1>

<div
class="comic-container"
id="comicContainer"
>

</div>

</div>

<script>

let chapters =

JSON.parse(

localStorage.getItem(
"infinite_x_chapters"
)

) || [];

let container =

document.getElementById(
"comicContainer"
);

container.innerHTML = "";

if(
chapters.length == 0
){

container.innerHTML =

"<h2>Belum ada chapter.</h2>";

}

chapters.forEach(
(chapter,index)=>{

container.innerHTML += `

<div class="comic-card">

<div class="card-inner">

<div class="card-front">

${
chapter.cover
?

'<img src="' +
chapter.cover +
'" class="cover-img">'

:

'No Cover'

}

</div>

<div class="card-back">

${chapter.desc}

</div>

</div>

<p class="chapter-price">

Price :

${chapter.price == 0 ? "Free" : chapter.price}

</p>

<a
href="chapter${index+1}.html"
class="chapter-btn"
>

${chapter.title}

</a>

</div>

`;

});

if(

localStorage.getItem(
"developerLogged"
) === "true"

){

document.getElementById(
"devButton"
).style.display =
"block";

}

</script>

</body>
</html>
