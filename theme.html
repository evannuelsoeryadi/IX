<!DOCTYPE html>
<html>
<head>

  
<title>Wallpaper Theme - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="home.html">
Home
</a>

<a href="comic.html">
Comic
</a>

<a href="character.html">
Character
</a>

<a href="about.html">
About Us
</a>

<a href="profile.html">
Profile
</a>

<a href="developer.html">
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1 class="theme-title">

Wallpaper Theme

</h1>

<div class="theme-container">

<div class="theme-item">

<img
src="wallpaper1.jpg"
class="theme-preview"
>

<h3>

🌆 Cyberpunk City

</h3>

<button
class="theme-btn"
id="cyberpunkBtn"
onclick="setTheme('cyberpunk')"
>

Use Theme

</button>



</div>

<div class="theme-item">

<img
src="wallpaper2.jpg"
class="theme-preview"
>

<h3>

🔵 Future Blue

</h3>

<button
class="theme-btn"
id="cyberpunkBtn"
onclick="setTheme('future')"
>

Use Theme

</button>



</div>

<div class="theme-item">

<img
src="wallpaper3.jpg"
class="theme-preview"
>

<h3>

🌌 Night Mountain

</h3>

<button
class="theme-btn"
id="cyberpunkBtn"
onclick="setTheme('mountain')"
>

Use Theme

</button>

</div>

<div class="theme-item">

<img
src="wallpaper4.jpg"
class="theme-preview"
>

<h3>

⚙️ Sci-Fi

</h3>

<button
class="theme-btn"
id="cyberpunkBtn"
onclick="setTheme('scifi')"
>

Use Theme

</button>

</div>

<div class="theme-item">

<img
src="wallpaper5.jpg"
class="theme-preview"
>

<h3>

🌃 Neon Street

</h3>

<button
class="theme-btn"
id="cyberpunkBtn"
onclick="setTheme('neon')"
>

Use Theme

</button>
  
</div>

</div>

<button
class="delete-btn reset-theme"
onclick="resetTheme()"
>

Reset Theme

</button>

</div>

<script src="theme.js"></script>

<script>

if(

localStorage.getItem(
"developerLogged"
) !== "true"

){

window.location.href =
"developer-login.html";

}

function resetTheme(){

localStorage.removeItem(
"devTheme"
);

document.body.className = "";

}

</script>

<div id="themeFade"></div>

</body>
</html>
