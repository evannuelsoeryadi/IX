<!DOCTYPE html>
<html>
<head>

<title>Reader - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>
⚙️ Dev Panel
</a>

</nav>

<div class="manage-container">

<h1 id="chapterTitle">Loading...</h1>

<div id="codeBox">

<input
type="text"
id="readerCode"
placeholder="Enter Code"
/>

<button
class="add-btn"
onclick="unlockChapter()"
>
Unlock
</button>

</div>

<p id="pageInfo" style="display:none;">
Page 1-10
</p>

<div id="readerPages"></div>

<div class="reader-buttons">

<button
id="prevBtn"
class="delete-btn"
style="display:none;"
onclick="prevPages()"
>
⬅ Previous
</button>

<button
id="nextBtn"
class="edit-btn"
style="display:none;"
onclick="nextPages()"
>
Next ➡
</button>

</div>

<button
id="finishBtn"
class="add-btn"
style="display:none;"
onclick="finishChapter()"
>
Finish Chapter
</button>

<br><br>

<a href="comic.html" class="chapter-btn">
⬅ Back to Comics
</a>

</div>

<script>

let chapters = JSON.parse(localStorage.getItem("infinite_x_chapters")) || [];

// =====================
// SAFE INDEX
// =====================
let currentChapter = Number(localStorage.getItem("currentChapter"));

if(isNaN(currentChapter) || currentChapter < 0 || currentChapter >= chapters.length){
    document.body.innerHTML = "<h2>Chapter tidak valid</h2>";
}

let chapter = chapters[currentChapter];
let currentPage = 0;

// =====================
// TITLE
// =====================
document.getElementById("chapterTitle").innerText = chapter.title;

// =====================
// CHECK UNLOCK
// =====================
function isUnlocked(){
    return localStorage.getItem("unlocked_" + currentChapter) === "true";
}

// =====================
// UNLOCK SYSTEM
// =====================
function unlockChapter(){

    let code = document.getElementById("readerCode").value;

    if(code === chapter.unlockCode){

        localStorage.setItem("unlocked_" + currentChapter, "true");

        document.getElementById("codeBox").style.display = "none";
        document.getElementById("pageInfo").style.display = "block";

        showPages();

    } else {
        alert("Wrong code!");
    }
}

// =====================
// SHOW PAGES (10 SYSTEM)
// =====================
function showPages(){

    if(!isUnlocked()){
        return;
    }

    let container = document.getElementById("readerPages");
    container.innerHTML = "";

    for(let i = currentPage; i < currentPage + 10 && i < chapter.pageImages.length; i++){

        container.innerHTML += `
            <img src="${chapter.pageImages[i]}" class="comic-image">
        `;
    }

    updateUI();
}

// =====================
// UI UPDATE
// =====================
function updateUI(){

    document.getElementById("pageInfo").innerText =
    "Page " +
    (currentPage + 1) +
    " - " +
    Math.min(currentPage + 10, chapter.pageImages.length) +
    " / " +
    chapter.pageImages.length;

    document.getElementById("prevBtn").style.display =
    currentPage === 0 ? "none" : "inline-block";

    if(currentPage + 10 < chapter.pageImages.length){
        document.getElementById("nextBtn").style.display = "inline-block";
        document.getElementById("finishBtn").style.display = "none";
    } else {
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("finishBtn").style.display = "inline-block";
    }
}

// =====================
// NEXT
// =====================
function nextPages(){
    currentPage += 10;
    showPages();
}

// =====================
// PREV
// =====================
function prevPages(){
    currentPage -= 10;
    if(currentPage < 0) currentPage = 0;
    showPages();
}

// =====================
// FINISH
// =====================
function finishChapter(){
    alert("The End");
    window.location.href = "comic.html";
}

// =====================
// DEV MODE
// =====================
if(localStorage.getItem("developerLogged") === "true"){
    document.getElementById("devButton").style.display = "block";
}

// =====================
// AUTO START IF UNLOCKED
// =====================
if(isUnlocked()){
    document.getElementById("codeBox").style.display = "none";
    document.getElementById("pageInfo").style.display = "block";
    showPages();
}

</script>

</body>
</html>
