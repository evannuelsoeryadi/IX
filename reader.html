<!DOCTYPE html>
<html>
<head>

    
<title>Reader - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="home.html">Home</a>
<a href="comic.html">Comic</a>
<a href="about.html">About Us</a>
<a href="character.html">Profile</a>


<a href="developer.html" id="devButton" style="display:none;">
⚙️ Dev Panel
</a>

</nav>

<!-- 🔥 PROGRESS BAR -->
<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div class="manage-container">

<h1 id="chapterTitle">Loading...</h1>

<div id="codeBox">

<input
type="text"
id="readerCode"
placeholder="Enter Code"
/>

<button class="add-btn" onclick="unlockChapter()">
Unlock
</button>

</div>

<p id="pageInfo" style="display:none;">
Scroll to read...
</p>

<div id="readerPages"></div>

<br><br>

<a href="comic.html" class="chapter-btn">
⬅ Back to Comics
</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {

getFirestore,

doc,

getDoc,

collection,

getDocs

}

from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================

const firebaseConfig={

apiKey:"AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",

authDomain:"infinite-x-f37a2.firebaseapp.com",

projectId:"infinite-x-f37a2",

storageBucket:"infinite-x-f37a2.firebasestorage.app",

messagingSenderId:"32543278362",

appId:"1:32543278362:web:54e231f17c92596888d8a3"

};

const app=

initializeApp(firebaseConfig);

const db=

getFirestore(app);

// =====================
// DATA
// =====================

let chapterId=

localStorage.getItem(
"selectedChapter"
);

let pages=[];

let currentPage=0;

let chapterData=null;

// =====================
// DEV PANEL
// =====================

if(

localStorage.getItem(
"developerLogged"
)==="true"

){

document.getElementById(
"devButton"
).style.display="block";

}

// =====================
// LOAD CHAPTER
// =====================

async function loadChapter(){

const chapterRef=

doc(

db,

"chapters",

chapterId

);

const snap=

await getDoc(chapterRef);

if(!snap.exists()){

alert("Chapter not found.");

location.href="comic.html";

return;

}

chapterData=snap.data();

document.getElementById(

"chapterTitle"

).innerText=

chapterData.title;

loadPages();

}

// =====================
// LOAD PAGES
// =====================

async function loadPages(){

pages=[];

const container=

document.getElementById(

"readerContainer"

);

container.innerHTML="";

const snapshot=

await getDocs(

collection(

db,

"chapters",

chapterId,

"pages"

)

);

snapshot.forEach(docSnap=>{

pages.push({

id:docSnap.id,

...docSnap.data()

});

});

pages.sort(

(a,b)=>

Number(a.id)-Number(b.id)

);

// render

pages.forEach((page,index)=>{

container.innerHTML+=`

<img

class="reader-image"

src="${page.url}"

data-page="${index}"

>

`;

});

document.getElementById(

"readerLoading"

).style.display="none";

document.getElementById(

"readerPage"

).style.display="flex";

updateProgress();

restoreReading();

}

// =====================
// RESTORE
// =====================

function restoreReading(){

let saved=

Number(

localStorage.getItem(

"lastReadPage"

)||0

);

if(saved>0){

currentPage=saved;

document

.querySelectorAll(

".reader-image"

)[saved]

.scrollIntoView({

behavior:"instant"

});

}

}

// =====================
// PROGRESS
// =====================

function updateProgress(){

document.getElementById(

"pageCounter"

).innerText=

(currentPage+1)

+" / "+pages.length;

let percent=

((currentPage+1)

/pages.length)

*100;

document.getElementById(

"progressBar"

).style.width=

percent+"%";

}

loadChapter();

// =====================
// AUTO SAVE
// =====================

function saveReading(){

localStorage.setItem(

"lastReadChapter",

chapterId

);

localStorage.setItem(

"lastReadPage",

currentPage

);

localStorage.setItem(

"lastReadTime",

Date.now()

);

}

// =====================
// SCROLL DETECTION
// =====================

window.addEventListener(

"scroll",

()=>{

const images=

document.querySelectorAll(

".reader-image"

);

let index=0;

images.forEach((img,i)=>{

const rect=

img.getBoundingClientRect();

if(

rect.top<=

window.innerHeight*0.4

){

index=i;

}

});

if(index!==currentPage){

currentPage=index;

updateProgress();

saveReading();

}

}

);

// =====================
// NEXT PAGE
// =====================

document.getElementById(

"nextBtn"

).onclick=()=>{

if(

currentPage<

pages.length-1

){

currentPage++;

document

.querySelectorAll(

".reader-image"

)

[currentPage]

.scrollIntoView({

behavior:"smooth"

});

updateProgress();

saveReading();

}

};

// =====================
// PREVIOUS PAGE
// =====================

document.getElementById(

"prevBtn"

).onclick=()=>{

if(currentPage>0){

currentPage--;

document

.querySelectorAll(

".reader-image"

)

[currentPage]

.scrollIntoView({

behavior:"smooth"

});

updateProgress();

saveReading();

}

};

// =====================
// BACK BUTTON
// =====================

document.getElementById(

"backBtn"

).onclick=()=>{

location.href=

"comic.html";

};

    
// =====================
// FULLSCREEN
// =====================

document.getElementById(

"fullscreenBtn"

).onclick=()=>{

if(!document.fullscreenElement){

document.documentElement.requestFullscreen();

}

else{

document.exitFullscreen();

}

};

// =====================
// KEYBOARD SHORTCUT
// =====================

document.addEventListener(

"keydown",

(e)=>{

switch(e.key){

case "ArrowRight":

document.getElementById(

"nextBtn"

).click();

break;

case "ArrowLeft":

document.getElementById(

"prevBtn"

).click();

break;

case "f":

case "F":

document.getElementById(

"fullscreenBtn"

).click();

break;

case "Escape":

if(document.fullscreenElement){

document.exitFullscreen();

}

break;

}

});

// =====================
// SETTINGS PANEL
// =====================

const settingPanel=

document.getElementById(

"settingPanel"

);

document.getElementById(

"settingBtn"

).onclick=()=>{

settingPanel.classList.toggle(

"show"

);

};

// =====================
// SAVE SETTINGS
// =====================

document.getElementById(

"saveSettingBtn"

).onclick=()=>{

localStorage.setItem(

"readerTheme",

document.getElementById(

"themeSelect"

).value

);

localStorage.setItem(

"readerMode",

document.getElementById(

"readingMode"

).value

);

localStorage.setItem(

"readerZoom",

document.getElementById(

"zoomSlider"

).value

);

alert("Settings Saved");

};

// =====================
// LOAD SETTINGS
// =====================

window.addEventListener(

"load",

()=>{

if(localStorage.getItem(

"readerTheme"

))

document.getElementById(

"themeSelect"

).value=

localStorage.getItem(

"readerTheme"

);

if(localStorage.getItem(

"readerMode"

))

document.getElementById(

"readingMode"

).value=

localStorage.getItem(

"readerMode"

);

if(localStorage.getItem(

"readerZoom"

))

document.getElementById(

"zoomSlider"

).value=

localStorage.getItem(

"readerZoom"

);

});

// =====================
// SCROLL TOP
// =====================

document.getElementById(

"scrollTopBtn"

).onclick=()=>{

window.scrollTo({

top:0,

behavior:"smooth"

});

};

// =====================
// FINISH
// =====================

</script>

<script src="theme.js"></script>

</body>

</html>
