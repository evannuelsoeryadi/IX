<!DOCTYPE html>
<html>
<head>

    
<title>Reader - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="home.html">Home</a>
<a href="comic.html">Comic</a>
<a href="about.html">About Us</a>
<a href="character.html">Profile</a>


<a href="developer.html" id="devButton" style="display:none;">
⚙️ Dev Panel
</a>

</nav>

<!-- 🔥 PROGRESS BAR -->
<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div class="manage-container">

<h1 id="chapterTitle">Loading...</h1>

<div id="codeBox">

<input
type="text"
id="readerCode"
placeholder="Enter Code"
/>

<button class="add-btn" onclick="unlockChapter()">
Unlock
</button>

</div>

<p id="pageInfo" style="display:none;">
Scroll to read...
</p>

<div id="readerPages"></div>

<br><br>

<a href="comic.html" class="chapter-btn">
⬅ Back to Comics
</a>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

// =====================
// FIREBASE
// =====================

const firebaseConfig = {
    apiKey: "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",
    authDomain: "infinite-x-f37a2.firebaseapp.com",
    projectId: "infinite-x-f37a2",
    storageBucket: "infinite-x-f37a2.firebasestorage.app",
    messagingSenderId: "32543278362",
    appId: "1:32543278362:web:54e231f17c92596888d8a3"
};

const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);

// =====================
// DATA
// =====================

const chapterId =
    localStorage.getItem(
        "selectedChapter"
    );

let pages = [];

let currentPage = 0;

let chapterData = null;

let unlocked = false;

// =====================
// USER
// =====================

const username =
    localStorage.getItem("user");

if(!username){

    location.href =
        "login.html";

}

// =====================
// DEV PANEL
// =====================

if(
    localStorage.getItem(
        "developerLogged"
    ) === "true"
){

    const devButton =
        document.getElementById(
            "devButton"
        );

    if(devButton){

        devButton.style.display =
            "block";

    }

}

// =====================
// CHECK CHAPTER
// =====================

if(!chapterId){

    alert(
        "Chapter tidak ditemukan!"
    );

    location.href =
        "comic.html";

}

// =====================
// LOAD CHAPTER
// =====================

async function loadChapter(){

    try{

        const chapterRef =
            doc(
                db,
                "chapters",
                chapterId
            );

        const snap =
            await getDoc(
                chapterRef
            );

        if(!snap.exists()){

            alert(
                "Chapter tidak ditemukan!"
            );

            location.href =
                "comic.html";

            return;

        }

        chapterData =
            snap.data();

        document.getElementById(
            "chapterTitle"
        ).innerText =
            chapterData.title ||
            "Untitled Chapter";

        // =====================
        // FREE / PAID
        // =====================

        const price =
            Number(
                chapterData.price || 0
            );

        if(price === 0){

            unlocked = true;

            document.getElementById(
                "codeBox"
            ).style.display =
                "none";

            showReader();

        }

        else{

            document.getElementById(
                "codeBox"
            ).style.display =
                "block";

            document.getElementById(
                "pageInfo"
            ).innerText =
                "Chapter ini membutuhkan code.";

        }

    }

    catch(error){

        console.error(
            "Load chapter error:",
            error
        );

        alert(
            "Gagal mengambil chapter!"
        );

    }

}

// =====================
// UNLOCK CHAPTER
// =====================

window.unlockChapter =
    async function(){

        if(!chapterData){

            return;

        }

        const input =
            document.getElementById(
                "readerCode"
            ).value.trim();

        if(input === ""){

            alert(
                "Masukkan code!"
            );

            return;

        }

        /*
         * Code chapter diambil dari
         * field "code" pada Firestore.
         */

        const chapterCode =
            chapterData.code;

        if(
            chapterCode &&
            input === String(chapterCode)
        ){

            unlocked = true;

            document.getElementById(
                "codeBox"
            ).style.display =
                "none";

            showReader();

        }

        else{

            alert(
                "Code salah!"
            );

        }

    };

// =====================
// SHOW READER
// =====================

async function showReader(){

    if(!unlocked){

        return;

    }

    pages =
        Array.isArray(
            chapterData.pageImages
        )

        ? chapterData.pageImages

        : [];

    const container =
        document.getElementById(
            "readerPages"
        );

    container.innerHTML = "";

    if(pages.length === 0){

        container.innerHTML = `

        <div class="comic-card">

            <h2>
                No Pages Yet
            </h2>

            <p>
                Chapter ini belum memiliki halaman.
            </p>

        </div>

        `;

        return;

    }

    pages.forEach(
        (url,index)=>{

            container.innerHTML += `

            <img

                class="reader-image"

                src="${url}"

                data-page="${index}"

                alt="Page ${index + 1}"

            >

            `;

        }
    );

    document.getElementById(
        "pageInfo"
    ).style.display =
        "block";

    await restoreReading();

    updateProgress();

}

// =====================
// READING DATA ID
// =====================

function getProgressId(){

    return (
        username +
        "_" +
        chapterId
    )
    .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
    );

}

// =====================
// LOAD READING PROGRESS
// =====================

async function restoreReading(){

    try{

        const progressRef =
            doc(
                db,
                "readingProgress",
                getProgressId()
            );

        const snap =
            await getDoc(
                progressRef
            );

        if(!snap.exists()){

            currentPage = 0;

            return;

        }

        const data =
            snap.data();

        currentPage =
            Number(
                data.page || 0
            );

        if(
            currentPage >=
            pages.length
        ){

            currentPage =
                pages.length - 1;

        }

        const images =
            document.querySelectorAll(
                ".reader-image"
            );

        if(images[currentPage]){

            setTimeout(()=>{

                images[
                    currentPage
                ].scrollIntoView({

                    behavior:
                        "instant",

                    block:
                        "start"

                });

            },100);

        }

    }

    catch(error){

        console.error(
            "Restore progress error:",
            error
        );

    }

}

// =====================
// SAVE READING
// =====================

async function saveReading(){

    if(!username ||
       !chapterId){

        return;

    }

    try{

        await setDoc(

            doc(
                db,
                "readingProgress",
                getProgressId()
            ),

            {

                username:
                    username,

                chapterId:
                    chapterId,

                page:
                    currentPage,

                time:
                    Date.now()

            },

            {
                merge:true
            }

        );

    }

    catch(error){

        console.error(
            "Save progress error:",
            error
        );

    }

}

// =====================
// PROGRESS
// =====================

function updateProgress(){

    if(
        pages.length === 0
    ){

        return;

    }

    const counter =
        document.getElementById(
            "pageInfo"
        );

    const percent =
        (
            (currentPage + 1)
            /
            pages.length
        ) * 100;

    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

    if(counter){

        counter.innerText =
            "Page " +
            (currentPage + 1) +
            " / " +
            pages.length;

    }

}

// =====================
// SCROLL DETECTION
// =====================

window.addEventListener(
    "scroll",
    ()=>{

        const images =
            document.querySelectorAll(
                ".reader-image"
            );

        if(!images.length){

            return;

        }

        let closest =
            0;

        images.forEach(
            (img,index)=>{

                const rect =
                    img.getBoundingClientRect();

                if(
                    rect.top <=
                    window.innerHeight * 0.4
                ){

                    closest =
                        index;

                }

            }
        );

        if(
            closest !==
            currentPage
        ){

            currentPage =
                closest;

            updateProgress();

            saveReading();

        }

    }
);

// =====================
// NEXT PAGE
// =====================

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

if(nextBtn){

    nextBtn.onclick =
        ()=>{

            if(
                currentPage <
                pages.length - 1
            ){

                currentPage++;

                const images =
                    document.querySelectorAll(
                        ".reader-image"
                    );

                images[
                    currentPage
                ].scrollIntoView({

                    behavior:
                        "smooth"

                });

                updateProgress();

                saveReading();

            }

        };

}

// =====================
// PREVIOUS PAGE
// =====================

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

if(prevBtn){

    prevBtn.onclick =
        ()=>{

            if(
                currentPage > 0
            ){

                currentPage--;

                const images =
                    document.querySelectorAll(
                        ".reader-image"
                    );

                images[
                    currentPage
                ].scrollIntoView({

                    behavior:
                        "smooth"

                });

                updateProgress();

                saveReading();

            }

        };

}

// =====================
// BACK
// =====================

const backBtn =
    document.getElementById(
        "backBtn"
    );

if(backBtn){

    backBtn.onclick =
        ()=>{

            location.href =
                "comic.html";

        };

}

// =====================
// FULLSCREEN
// =====================

const fullscreenBtn =
    document.getElementById(
        "fullscreenBtn"
    );

if(fullscreenBtn){

    fullscreenBtn.onclick =
        ()=>{

            if(
                !document.fullscreenElement
            ){

                document
                    .documentElement
                    .requestFullscreen();

            }

            else{

                document.exitFullscreen();

            }

        };

}

// =====================
// KEYBOARD
// =====================

document.addEventListener(
    "keydown",
    e=>{

        if(e.key === "ArrowRight"){

            if(nextBtn){

                nextBtn.click();

            }

        }

        if(e.key === "ArrowLeft"){

            if(prevBtn){

                prevBtn.click();

            }

        }

        if(
            e.key === "f" ||
            e.key === "F"
        ){

            if(fullscreenBtn){

                fullscreenBtn.click();

            }

        }

        if(e.key === "Escape"){

            if(
                document.fullscreenElement
            ){

                document.exitFullscreen();

            }

        }

    }
);

// =====================
// INIT
// =====================

loadChapter();

</script>

<script src="theme.js"></script>

</body>

</html>
