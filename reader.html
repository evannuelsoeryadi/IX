<!DOCTYPE html>
<html>
<head>

    
<title>Reader - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Profile</a>
<a href="#">About Us</a>

<a href="developer.html" id="devButton" style="display:none;">
⚙️ Dev Panel
</a>

</nav>

<!-- 🔥 PROGRESS BAR -->
<div id="progressContainer">
    <div id="progressBar"></div>
</div>

<div class="manage-container">

<h1 id="chapterTitle">Loading...</h1>

<div id="codeBox">

<input
type="text"
id="readerCode"
placeholder="Enter Code"
/>

<button class="add-btn" onclick="unlockChapter()">
Unlock
</button>

</div>

<p id="pageInfo" style="display:none;">
Scroll to read...
</p>

<div id="readerPages"></div>

<br><br>

<a href="comic.html" class="chapter-btn">
⬅ Back to Comics
</a>

</div>

<script>

let chapters = JSON.parse(localStorage.getItem("infinite_x_chapters")) || [];

let currentChapter = Number(localStorage.getItem("currentChapter"));

if(isNaN(currentChapter) || currentChapter < 0 || currentChapter >= chapters.length){
    document.body.innerHTML = "<h2>Chapter tidak valid</h2>";
}

let chapter = chapters[currentChapter];

// =====================
// TITLE
// =====================
document.getElementById("chapterTitle").innerText = chapter.title;

// =====================
// UNLOCK CHECK
// =====================
function isUnlocked(){
    return localStorage.getItem("unlocked_" + currentChapter) === "true";
}

// =====================
// UNLOCK
// =====================
function unlockChapter(){

    let code = document.getElementById("readerCode").value;

    if(code === chapter.unlockCode){

        localStorage.setItem("unlocked_" + currentChapter, "true");

        document.getElementById("codeBox").style.display = "none";
        document.getElementById("pageInfo").style.display = "block";

        renderPages();

    } else {
        alert("Wrong code!");
    }
}

// =====================
// RENDER WEBTOON
// =====================
function renderPages(){

    if(!isUnlocked()) return;

    let container = document.getElementById("readerPages");
    container.innerHTML = "";

    chapter.pageImages.forEach((img, index) => {

        container.innerHTML += `
            <img src="${img}" class="comic-image webtoon-page">
        `;

    });

    restoreScroll();
}

// =====================
// SAVE SCROLL POSITION
// =====================
function saveScroll(){

    localStorage.setItem(
        "scroll_" + currentChapter,
        window.scrollY
    );

    updateProgress();
}

// =====================
// RESTORE SCROLL POSITION
// =====================
function restoreScroll(){

    let saved = localStorage.getItem("scroll_" + currentChapter);

    if(saved){
        window.scrollTo(0, Number(saved));
    }
}

// =====================
// PROGRESS BAR
// =====================
function updateProgress(){

    let scrollTop = window.scrollY;
    let docHeight = document.body.scrollHeight - window.innerHeight;

    let progress = (scrollTop / docHeight) * 100;

    document.getElementById("progressBar").style.width = progress + "%";
}

// =====================
// SCROLL LISTENER
// =====================
window.addEventListener("scroll", () => {
    saveScroll();
});

// =====================
// DEV MODE
// =====================
if(localStorage.getItem("developerLogged") === "true"){
    document.getElementById("devButton").style.display = "block";
}

// =====================
// AUTO INIT
// =====================
if(isUnlocked()){
    document.getElementById("codeBox").style.display = "none";
    document.getElementById("pageInfo").style.display = "block";
    renderPages();
}

</script>

</body>
</html>
