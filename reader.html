<!DOCTYPE html>
<html>
<head>

<title>Reader - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

</head>

<body>

<nav>

<a href="index.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="#">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1
id="chapterTitle"
>

Loading...

</h1>

<div
id="codeBox"
>

<input
type="text"
id="readerCode"
placeholder="Enter Code"
>

<button
class="add-btn"
onclick="unlockChapter()"
>

Unlock

</button>

</div>

<p
id="pageInfo"
style="display:none;"
>

Page 1-10

</p>

<div
id="readerPages"
>

</div>

<div
class="reader-buttons"
>

<button
id="prevBtn"
class="delete-btn"
style="display:none;"
onclick="prevPages()"
>

⬅ Previous

</button>

<button
id="nextBtn"
class="edit-btn"
style="display:none;"
onclick="nextPages()"
>

Next ➡

</button>

</div>

<button
id="finishBtn"
class="add-btn"
style="display:none;"
onclick="finishChapter()"
>

Finish Chapter

</button>

<br><br>

<a
href="comic.html"
class="chapter-btn"
>

⬅ Back to Comics

</a>

</div>

<script src="reader.js">
let chapters =

JSON.parse(

localStorage.getItem(
"infinite_x_chapters"
)

) || [];

let currentChapter =

localStorage.getItem(
"currentChapter"
);

let chapter =

chapters[currentChapter];

let currentPage = 0;

document.getElementById(
"chapterTitle"
).innerText =

chapter.title;

function unlockChapter(){

let code =

document.getElementById(
"readerCode"
).value;

if(

code != chapter.unlockCode

){

alert(
"Wrong code!"
);

return;

}

document.getElementById(
"codeBox"
).style.display =
"none";

document.getElementById(
"pageInfo"
).style.display =
"block";

showPages();

}

function showPages(){

let container =

document.getElementById(
"readerPages"
);

container.innerHTML = "";

for(

let i=currentPage;

i<currentPage+10 &&
i<chapter.pageImages.length;

i++

){

container.innerHTML += `

<img
src="${chapter.pageImages[i]}"
class="comic-image"
>

`;

}

document.getElementById(
"pageInfo"
).innerText =

"Page " +

(currentPage + 1)

+

" - "

+

Math.min(

currentPage + 10,

chapter.pageImages.length

)

+

" / "

+

chapter.pageImages.length;

if(

currentPage == 0

){

document.getElementById(
"prevBtn"
).style.display =
"none";

}

else{

document.getElementById(
"prevBtn"
).style.display =
"inline-block";

}

if(

currentPage + 10 <

chapter.pageImages.length

){

document.getElementById(
"nextBtn"
).style.display =
"inline-block";

document.getElementById(
"finishBtn"
).style.display =
"none";

}

else{

document.getElementById(
"nextBtn"
).style.display =
"none";

document.getElementById(
"finishBtn"
).style.display =
"inline-block";

}

}

function nextPages(){

currentPage += 10;

showPages();

}

function prevPages(){

currentPage -= 10;

if(

currentPage < 0

){

currentPage = 0;

}

showPages();

}

function finishChapter(){

alert(
"The End"
);

window.location.href =
"comic.html";

}

if(

localStorage.getItem(
"developerLogged"
) === "true"

){

document.getElementById(
"devButton"
).style.display =
"block";

}

</script>

</body>
</html>
