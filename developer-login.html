<!DOCTYPE html>
<html>
<head>
    <title>Developer Login - Infinite X</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <h1>Developer Login</h1>

        <input
            type="text"
            id="developerID"
            placeholder="Developer ID"
        >

        <input
            type="password"
            id="developerPass"
            placeholder="Password"
        >

        <label style="color:white;">

            <input
                type="checkbox"
                onclick="toggleDevPassword()"
                style="width:auto;"
            >

            Show Password

        </label>

        <button onclick="developerLogin()">
            Login
        </button>

        <a href="whoareyou.html" class="back-btn">
            ← Back
        </a>

    </div>

    <script>

        function developerLogin(){

            let id =
                document.getElementById(
                    "developerID"
                ).value;

            let pass =
                document.getElementById(
                    "developerPass"
                ).value;

            /* OWNER 1 */

            if(
                id === "Evan01" &&
                pass === "23062012"
            ){

                localStorage.setItem(
                    "developerLogged",
                    "true"
                );

                localStorage.setItem(
                    "developerID",
                    "Evan01"
                );

                localStorage.setItem(
                    "developerName",
                    "Evan"
                );

                localStorage.setItem(
                    "developerRole",
                    "Owner"
                );

                localStorage.setItem(
                    "user",
                    "Evan"
                );

                window.location.href =
                    "developer.html";

                return;
            }

            /* OWNER 2 */

            if(
                id === "Aldo02" &&
                pass === "15032012"
            ){

                localStorage.setItem(
                    "developerLogged",
                    "true"
                );

                localStorage.setItem(
                    "developerID",
                    "Aldo02"
                );

                localStorage.setItem(
                    "developerName",
                    "Aldo"
                );

                localStorage.setItem(
                    "developerRole",
                    "Owner"
                );

                localStorage.setItem(
                    "user",
                    "Aldo"
                );

                window.location.href =
                    "developer.html";

                return;
            }

            /* OWNER 3 */

            if(
                id === "Darren03" &&
                pass === "2808201210"
            ){

                localStorage.setItem(
                    "developerLogged",
                    "true"
                );

                localStorage.setItem(
                    "developerID",
                    "Darren03"
                );

                localStorage.setItem(
                    "developerName",
                    "Darren"
                );

                localStorage.setItem(
                    "developerRole",
                    "Owner"
                );

                localStorage.setItem(
                    "user",
                    "Darren"
                );

                window.location.href =
                    "developer.html";

                return;
            }

            alert(
                "Developer ID atau Password salah!"
            );

        }

        function toggleDevPassword(){

            let pass =
                document.getElementById(
                    "developerPass"
                );

            if(pass.type === "password"){

                pass.type = "text";

            }else{

                pass.type = "password";

            }

        }

    </script>

</body>
</html>
