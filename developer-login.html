<!DOCTYPE html>
<html>
<head>
    <title>Developer Login - Infinite X</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">

    
</head>

<body>

    <div class="login-box">

        <h1>Developer Login</h1>

        <input
            type="text"
            id="developerID"
            placeholder="Developer ID"
        >

        <input
            type="password"
            id="developerPass"
            placeholder="Password"
        >

        <label style="color:white;">

            <input
                type="checkbox"
                onclick="toggleDevPassword()"
                style="width:auto;"
            >

            Show Password

        </label>

        <button onclick="developerLogin()">
            Login
        </button>

        <a href="whoareyou.html" class="back-btn">
            ← Back
        </a>

    </div>

    <script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


// =====================
// FIREBASE
// =====================

const firebaseConfig = {

    apiKey:
    "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",

    authDomain:
    "infinite-x-f37a2.firebaseapp.com",

    projectId:
    "infinite-x-f37a2",

    storageBucket:
    "infinite-x-f37a2.firebasestorage.app",

    messagingSenderId:
    "32543278362",

    appId:
    "1:32543278362:web:54e231f17c92596888d8a3"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


// =====================
// LOGIN
// =====================

async function developerLogin(){

    const id =
        document
        .getElementById("developerID")
        .value
        .trim();

    const pass =
        document
        .getElementById("developerPass")
        .value;


    if(
        id === "" ||
        pass === ""
    ){

        alert(
            "Lengkapi data dulu!"
        );

        return;

    }


    try{

        const email =
            id.toLowerCase()
            +
            "@infinite-x.local";


        // =========================
        // FIREBASE AUTH
        // =========================

        const result =
            await signInWithEmailAndPassword(
                auth,
                email,
                pass
            );


        const uid =
            result.user.uid;


        // =========================
        // GET DEVELOPER DATA
        // =========================

        const userDoc =
            await getDoc(

                doc(
                    db,
                    "users",
                    uid
                )

            );


        if(
            !userDoc.exists()
        ){

            alert(
                "Data Developer tidak ditemukan."
            );

            await auth.signOut();

            return;

        }


        const data =
            userDoc.data();


        // =========================
        // ROLE CHECK
        // =========================

        if(
            data.role !== "Owner"
        ){

            alert(
                "Akun ini bukan Developer."
            );

            await auth.signOut();

            return;

        }


        // =========================
        // SAVE SESSION
        // =========================

        sessionStorage.setItem(
            "firebaseUID",
            uid
        );

        sessionStorage.setItem(
            "developerLogged",
            "true"
        );

        sessionStorage.setItem(
            "developerID",
            data.developerID || id
        );

        sessionStorage.setItem(
            "developerName",
            data.username || ""
        );

        sessionStorage.setItem(
            "developerRole",
            data.role
        );


        // =========================
        // GO DEV PANEL
        // =========================

        window.location.href =
            "developer.html";

    }


    catch(error){

        console.error(error);


        alert(
            "Developer ID atau Password salah!"
        );

    }

}


// =====================
// SHOW PASSWORD
// =====================

function toggleDevPassword(){

    const pass =
        document.getElementById(
            "developerPass"
        );


    if(
        pass.type === "password"
    ){

        pass.type = "text";

    }
    else{

        pass.type = "password";

    }

}


// =====================
// GLOBAL
// =====================

window.developerLogin =
    developerLogin;

window.toggleDevPassword =
    toggleDevPassword;

</script>

</body>
</html>
