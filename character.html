
<!DOCTYPE html>
<html>
<head>

<title>Characters - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="home.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1>

Characters

</h1>

<div class="search-box">

<input
type="text"
id="searchCharacter"
placeholder="🔍 Search character..."
>

</div>

<div
class="character-grid"
id="characterGrid"
>

</div>

</div>

<script>

// =====================
// DEV PANEL
// =====================

if(

localStorage.getItem(
"developerLogged"
)==="true"

){

document.getElementById(
"devButton"
).style.display="block";

}

// =====================
// LOAD CHARACTERS
// =====================

let characters=

JSON.parse(

localStorage.getItem(
"infinite_x_characters"
)

)||[];

// =====================
// RENDER
// =====================

if(characters.length===0){

document.getElementById(
"characterGrid"
).innerHTML=`

<div class="comic-card">

<h2>

No Characters Yet

</h2>

<p>

Coming Soon...

</p>

</div>

`;

}

else{

let html="";

characters.forEach(character=>{

html+=`

<div class="comic-card">

<img

src="${character.image}"

class="character-image"

>

<h2>

${character.name}

</h2>

<p>

${character.role}

</p>

<p>

${character.desc}

</p>

</div>

`;

});

document.getElementById(
"characterGrid"
).innerHTML=html;

}

// =====================
// SEARCH
// =====================

document.getElementById(
"searchCharacter"
)

.addEventListener(

"input",

e=>{

let keyword=

e.target.value

.toLowerCase();

document

.querySelectorAll(
".comic-card"
)

.forEach(card=>{

card.style.display=

card.innerText

.toLowerCase()

.includes(keyword)

?

"block"

:

"none";

});

}

);

</script>
<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
