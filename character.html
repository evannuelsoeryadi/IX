
<!DOCTYPE html>
<html>
<head>

<title>Characters - Infinite X</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="manage.css">
<link rel="stylesheet" href="theme.css">

</head>

<body>

<nav>

<a href="home.html">Home</a>
<a href="comic.html">Comic</a>
<a href="character.html">Character</a>
<a href="about.html">About Us</a>
<a href="profile.html">Profile</a>

<a
href="developer.html"
id="devButton"
style="display:none;"
>

⚙️ Dev Panel

</a>

</nav>

<div class="manage-container">

<h1>

Characters

</h1>

<div class="search-box">

<input
type="text"
id="searchCharacter"
placeholder="🔍 Search character..."
>

</div>

<div
class="character-grid"
id="characterGrid"
>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
    getFirestore,
    collection,
    getDocs
}
from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";


// =====================
// FIREBASE
// =====================

const firebaseConfig = {

    apiKey:
    "AIzaSyBxksahQKfodVKIbuSFGGhJt7RCAuveT5Y",

    authDomain:
    "infinite-x-f37a2.firebaseapp.com",

    projectId:
    "infinite-x-f37a2",

    storageBucket:
    "infinite-x-f37a2.firebasestorage.app",

    messagingSenderId:
    "32543278362",

    appId:
    "1:32543278362:web:54e231f17c92596888d8a3"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


// =====================
// DEV PANEL
// =====================

if(

    sessionStorage.getItem(
        "developerLogged"
    ) === "true"

){

    document.getElementById(
        "devButton"
    ).style.display = "block";

}


// =====================
// LOAD CHARACTERS
// =====================

let characters = [];


async function loadCharacters(){

    const grid =
        document.getElementById(
            "characterGrid"
        );


    grid.innerHTML = "";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "characters"
                )
            );


        snapshot.forEach(
            docSnap => {

                characters.push({

                    id:
                        docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        renderCharacters();

    }

    catch(error){

        console.error(
            "Character Firebase Error:",
            error
        );


        grid.innerHTML = `

            <div class="comic-card">

                <h2>
                    Failed to Load Characters
                </h2>

                <p>
                    Please try again later.
                </p>

            </div>

        `;

    }

}


// =====================
// RENDER
// =====================

function renderCharacters(){

    const grid =
        document.getElementById(
            "characterGrid"
        );


    grid.innerHTML = "";


    if(
        characters.length === 0
    ){

        grid.innerHTML = `

            <div class="comic-card">

                <h2>
                    No Characters Yet
                </h2>

                <p>
                    Coming Soon...
                </p>

            </div>

        `;

        return;

    }


    let html = "";


    characters.forEach(
        character => {

            html += `

                <div class="comic-card">

                    <img
                        src="${
                            character.image ||
                            "https://placehold.co/300x400"
                        }"
                        class="character-image"
                    >

                    <h2>
                        ${character.name || "Unknown"}
                    </h2>

                    <p>
                        ${character.role || ""}
                    </p>

                    <p>
                        ${character.desc || ""}
                    </p>

                </div>

            `;

        }
    );


    grid.innerHTML = html;

}


// =====================
// SEARCH
// =====================

document
.getElementById(
    "searchCharacter"
)
.addEventListener(
    "input",
    e => {

        const keyword =
            e.target.value
            .toLowerCase();


        document
        .querySelectorAll(
            "#characterGrid .comic-card"
        )
        .forEach(
            card => {

                card.style.display =

                    card.innerText
                    .toLowerCase()
                    .includes(keyword)

                    ? "block"

                    : "none";

            }
        );

    }
);


// =====================
// INIT
// =====================

loadCharacters();

</script>
<div id="themeFade"></div>

<script src="theme.js"></script>

</body>
</html>
